<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interval · Spaced Reps for Coding Interviews</title>
<meta id="metaDescription" name="description" content="Interval — a spaced-repetition trainer for the Blind 75, NeetCode 150, and NeetCode 250.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
<style>
:root{
  color-scheme: light;
  --surface-1:#fcfcfb; --page:#f9f9f7;
  --ink-1:#0b0b0b; --ink-2:#52514e; --ink-muted:#898781;
  --grid:#e1e0d9; --baseline:#c3c2b7; --ring:rgba(11,11,11,0.10);
  --blue:#2a78d6; --blue-soft:#cde2fb; --blue-mid:#86b6ef;
  --seq-100:#cde2fb; --seq-200:#9ec5f4; --seq-350:#5598e7; --seq-500:#256abf; --seq-650:#104281;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-text:#006300;
  --chip-bg:#f0efec;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-1:#1a1a19; --page:#0d0d0d;
  --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-muted:#898781;
  --grid:#2c2c2a; --baseline:#383835; --ring:rgba(255,255,255,0.10);
  --blue:#3987e5; --blue-soft:#184f95; --blue-mid:#1c5cab;
  --seq-100:#0d366b; --seq-200:#104281; --seq-350:#1c5cab; --seq-500:#3987e5; --seq-650:#86b6ef;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-text:#0ca30c;
  --chip-bg:#262624;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --surface-1:#1a1a19; --page:#0d0d0d;
    --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --ring:rgba(255,255,255,0.10);
    --blue:#3987e5; --blue-soft:#184f95; --blue-mid:#1c5cab;
    --seq-100:#0d366b; --seq-200:#104281; --seq-350:#1c5cab; --seq-500:#3987e5; --seq-650:#86b6ef;
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
    --good-text:#0ca30c;
    --chip-bg:#262624;
  }
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--page); color:var(--ink-1);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.5;
}
a{color:var(--blue); text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:880px; margin:0 auto; padding:0 16px 80px}
header.site{
  display:flex; align-items:center; gap:12px; padding:18px 0 10px; flex-wrap:wrap;
}
.logo{font-weight:700; font-size:19px; letter-spacing:-0.01em}
.logo .accent{color:var(--blue)}
.spacer{flex:1}
.streak-chip{
  display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px;
  background:var(--chip-bg); font-size:13px; color:var(--ink-2); font-weight:600;
}
.iconbtn{
  border:1px solid var(--ring); background:var(--surface-1); color:var(--ink-2);
  border-radius:8px; padding:5px 10px; font-size:13px; cursor:pointer; font-family:inherit;
}
.iconbtn:hover{color:var(--ink-1)}
nav.tabs{
  display:flex; gap:2px; border-bottom:1px solid var(--grid); margin-bottom:20px; overflow-x:auto;
}
nav.tabs button{
  appearance:none; background:none; border:none; font-family:inherit; font-size:14px;
  padding:9px 14px; cursor:pointer; color:var(--ink-2); border-bottom:2px solid transparent;
  white-space:nowrap; font-weight:500;
}
nav.tabs button.active{color:var(--ink-1); border-bottom-color:var(--blue); font-weight:600}
nav.tabs button .cnt{
  display:inline-block; margin-left:6px; font-size:11px; font-weight:700; padding:1px 7px;
  border-radius:999px; background:var(--chip-bg); color:var(--ink-2);
}
nav.tabs button .cnt.hot{background:var(--critical); color:#fff}
h2{font-size:16px; margin:26px 0 10px}
h2:first-child{margin-top:0}
.sub{color:var(--ink-muted); font-size:13px; margin:-6px 0 14px}
.card{
  background:var(--surface-1); border:1px solid var(--ring); border-radius:12px;
  padding:14px 16px; margin-bottom:10px;
}
.prob-head{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; cursor:pointer}
.prob-name{font-weight:600; font-size:15px}
.prob-meta{color:var(--ink-muted); font-size:12.5px}
.badge{
  display:inline-block; font-size:11px; font-weight:700; padding:1px 8px; border-radius:999px;
  background:var(--chip-bg); color:var(--ink-2); vertical-align:1px;
}
.badge.easy{color:var(--good-text)}
.badge.medium{color:#946200}
:root[data-theme="dark"] .badge.medium{color:var(--warning)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .badge.medium{color:var(--warning)} }
.badge.hard{color:var(--critical)}
.due-tag{font-size:12.5px; font-weight:600}
.due-tag.overdue{color:var(--critical)}
.due-tag.today{color:var(--ink-1)}
.due-tag.later{color:var(--ink-muted); font-weight:500}
.result-icon{font-size:12.5px; color:var(--ink-2)}
.logform{margin-top:12px; padding-top:12px; border-top:1px solid var(--grid)}
.result-btns{display:flex; gap:8px; flex-wrap:wrap}
.rbtn{
  flex:1; min-width:150px; text-align:left; border-radius:10px; padding:9px 12px; cursor:pointer;
  border:1px solid var(--ring); background:var(--surface-1); font-family:inherit; color:var(--ink-1);
}
.rbtn:hover{border-color:var(--baseline)}
.rbtn.selected{outline:2px solid var(--blue); outline-offset:-1px}
.rbtn .rt{font-weight:700; font-size:13.5px; display:flex; gap:6px; align-items:center}
.rbtn .rs{font-size:12px; color:var(--ink-muted); margin-top:2px}
.dot{width:9px; height:9px; border-radius:50%; display:inline-block; flex:none}
.dot.cold{background:var(--good)} .dot.hints{background:var(--warning)} .dot.video{background:var(--critical)}
.dot.new{background:var(--blue)} .dot.scheduled{background:var(--baseline)} .dot.solid{background:var(--seq-650)}
.formrow{display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; align-items:flex-start}
input[type=number], input[type=date], input[type=search], textarea{
  font-family:inherit; font-size:14px; color:var(--ink-1); background:var(--page);
  border:1px solid var(--ring); border-radius:8px; padding:7px 10px;
}
input[type=number]{width:90px}
textarea{flex:1; min-width:220px; min-height:38px; resize:vertical}
.primary{
  background:var(--blue); color:#fff; border:none; border-radius:8px; padding:8px 16px;
  font-family:inherit; font-size:14px; font-weight:600; cursor:pointer;
}
.primary:disabled{opacity:.45; cursor:default}
.ghost{background:none; border:none; color:var(--ink-muted); font-family:inherit; font-size:13px; cursor:pointer; padding:6px 8px}
.ghost:hover{color:var(--ink-1)}
details.notes{margin-top:10px; font-size:13.5px}
details.notes summary{cursor:pointer; color:var(--ink-muted); font-size:12.5px; user-select:none}
details.notes .note-body{margin-top:6px; color:var(--ink-2); background:var(--chip-bg); border-radius:8px; padding:8px 10px; white-space:pre-wrap}
.history{margin-top:8px; font-size:12.5px; color:var(--ink-2)}
.history .hrow{display:flex; gap:8px; align-items:center; padding:3px 0}
.history .hdate{color:var(--ink-muted); font-variant-numeric:tabular-nums; width:84px; flex:none}
.history .hnote{color:var(--ink-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1}
.history .hdel{visibility:hidden}
.history .hrow:hover .hdel{visibility:visible}
.empty{color:var(--ink-muted); font-size:14px; padding:26px 0; text-align:center}
.sitefoot{margin-top:44px; padding-top:14px; border-top:1px solid var(--grid); text-align:center; font-size:12.5px; color:var(--ink-muted)}
.sitefoot a{color:var(--ink-2)}
.sitefoot .credit{display:block; margin-top:7px; line-height:1.55}
.kofi-nudge{display:block; margin-top:6px; font-size:13px}
.kofi-nudge a{color:var(--ink-2)}
/* All-problems view */
.cat-block{margin-bottom:8px}
.cat-head{
  display:flex; align-items:center; gap:10px; cursor:pointer; padding:10px 4px;
  border-bottom:1px solid var(--grid); user-select:none;
}
.cat-head .cat-name{font-weight:600; font-size:14.5px; flex:1}
.cat-mini{width:120px; height:6px; background:var(--chip-bg); border-radius:3px; overflow:hidden; flex:none}
.cat-mini i{display:block; height:100%; background:var(--blue); border-radius:3px}
.cat-count{font-size:12px; color:var(--ink-muted); width:52px; text-align:right; font-variant-numeric:tabular-nums}
.chev{color:var(--ink-muted); font-size:11px; width:12px}
table.plist{width:100%; border-collapse:collapse; font-size:13.5px}
table.plist td{padding:7px 6px; border-bottom:1px solid var(--grid); vertical-align:middle}
table.plist tr:hover td{background:var(--chip-bg)}
table.plist tr{cursor:pointer}
td.c-dot{width:18px}
td.c-diff{width:70px}
td.c-due{width:110px; text-align:right; font-variant-numeric:tabular-nums; color:var(--ink-muted); font-size:12.5px}
td.c-n{width:36px; text-align:right; color:var(--ink-muted); font-variant-numeric:tabular-nums; font-size:12.5px}
.searchrow{display:flex; gap:10px; margin-bottom:14px; align-items:center; flex-wrap:wrap}
input[type=search]{flex:1; min-width:200px}
.filterchips{display:flex; gap:6px}
.fchip{font-size:12.5px; padding:4px 10px; border-radius:999px; border:1px solid var(--ring); background:none; color:var(--ink-2); cursor:pointer; font-family:inherit}
.fchip.on{background:var(--chip-bg); color:var(--ink-1); font-weight:600}
.prefsbar{
  display:flex; gap:18px; align-items:center; flex-wrap:wrap; margin-bottom:14px;
  padding:10px 12px; border:1px solid var(--ring); border-radius:11px; background:var(--surface-1);
}
.prefgroup{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.preflabel{font-size:12px; color:var(--ink-muted); font-weight:600}
.seg{display:inline-flex; padding:2px; border-radius:8px; background:var(--chip-bg)}
.seg button{
  appearance:none; border:0; border-radius:6px; background:none; color:var(--ink-2);
  font-family:inherit; font-size:12.5px; padding:4px 9px; cursor:pointer;
}
.seg button.on{background:var(--surface-1); color:var(--ink-1); font-weight:700; box-shadow:0 1px 3px var(--ring)}
.outside-block{margin-top:24px; padding-top:12px; border-top:1px dashed var(--baseline)}
.outside-tag{margin-left:6px; font-size:10.5px; color:var(--ink-muted); font-weight:600}
.tier-progress{display:grid; gap:7px; margin:0 0 24px}
.tier-progress .brow{margin:0}
/* Stats */
.tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-bottom:24px}
.tile{background:var(--surface-1); border:1px solid var(--ring); border-radius:12px; padding:12px 14px}
.tile .tv{font-size:26px; font-weight:700; letter-spacing:-0.02em}
.tile .tv small{font-size:14px; color:var(--ink-muted); font-weight:500}
.tile .tl{font-size:12px; color:var(--ink-muted); margin-top:2px}
.bars{margin-bottom:26px}
.brow{display:flex; align-items:center; gap:10px; margin-bottom:7px}
.brow .bl{width:170px; flex:none; font-size:12.5px; color:var(--ink-2); text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.brow .btrack{flex:1; height:14px; background:var(--chip-bg); border-radius:4px; position:relative; overflow:hidden}
.brow .bfill{position:absolute; inset:0 auto 0 0; background:var(--seq-350); border-radius:4px 4px 4px 4px}
.brow .bfill.solidpart{background:var(--seq-650)}
.brow .bv{width:56px; flex:none; font-size:12px; color:var(--ink-muted); font-variant-numeric:tabular-nums}
.legend{display:flex; gap:16px; font-size:12px; color:var(--ink-2); margin:4px 0 12px}
.legend .li{display:inline-flex; align-items:center; gap:6px}
.legend .sw{width:10px; height:10px; border-radius:3px; display:inline-block}
/* heatmap */
.heat{display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,14px); gap:3px; margin:8px 0 4px; width:max-content}
.hcell{width:14px; height:14px; border-radius:3px; background:var(--chip-bg)}
.heat-legend{display:flex; align-items:center; gap:4px; font-size:11.5px; color:var(--ink-muted); margin-bottom:8px}
.heat-legend .hcell{width:11px;height:11px}
.sharebar{display:flex; justify-content:flex-end; gap:8px; margin:0 0 10px}
/* About */
.prose{max-width:660px; font-size:14.5px; color:var(--ink-2)}
.prose h3{color:var(--ink-1); font-size:14.5px; margin:22px 0 6px}
.prose p{margin:0 0 12px}
.prose .refs{font-size:12.5px; color:var(--ink-muted); border-top:1px solid var(--grid); padding-top:12px; margin-top:20px}
.sched-table{border-collapse:collapse; font-size:13px; margin:8px 0 14px}
.sched-table td,.sched-table th{border:1px solid var(--grid); padding:6px 12px; text-align:left}
.sched-table th{font-weight:600; color:var(--ink-1); background:var(--chip-bg)}
/* leeches */
.card.leech{border-color:var(--serious); background:linear-gradient(0deg,var(--surface-1),var(--surface-1))}
.leech-tag{font-size:11px; font-weight:700; padding:1px 8px; border-radius:999px; background:var(--serious); color:#fff}
.leech-box{margin-top:10px; padding:10px 12px; border-radius:9px; background:var(--chip-bg); font-size:13px; color:var(--ink-2)}
.leech-box strong{color:var(--ink-1)}
.leech-box .recall{margin-top:8px}
.leech-box textarea{width:100%; min-width:0}
/* new-problem gate */
.gate{
  background:var(--surface-1); border:1px dashed var(--baseline); border-radius:12px;
  padding:18px 20px; text-align:center; color:var(--ink-2); font-size:14px;
}
.gate strong{color:var(--ink-1)}
.gate .gsub{font-size:12.5px; color:var(--ink-muted); margin-top:6px}
.gate button{margin-top:10px}
/* skip + hints on new problems */
.skipbtn{font-size:12px; color:var(--ink-muted); background:none; border:none; cursor:pointer; font-family:inherit; padding:2px 6px}
.skipbtn:hover{color:var(--critical)}
.newpat{font-size:12px; color:var(--blue); font-weight:600}
.transfer{
  margin-top:10px; padding:10px 12px; border-left:3px solid var(--blue); background:var(--chip-bg);
  border-radius:0 9px 9px 0; font-size:13px; color:var(--ink-2);
}
.transfer strong{color:var(--ink-1)}
.transfer .card{margin:10px 0 0; background:var(--page)}
.linkbtn{background:none; border:none; color:var(--blue); font-family:inherit; font-size:13px; cursor:pointer; padding:0; font-weight:600}
.linkbtn:hover{text-decoration:underline}
.secondary-link{font-size:12.5px; color:var(--ink-muted); margin-bottom:9px}
.secondary-link a{color:var(--ink-2)}
.xfer-note{display:flex; gap:7px; align-items:flex-start; margin-top:10px; font-size:12.5px; color:var(--ink-2)}
/* sync */
.syncbar{
  background:var(--surface-1); border:1px solid var(--ring); border-radius:12px;
  padding:14px 16px; margin-bottom:14px; font-size:13.5px; color:var(--ink-2);
  display:grid; gap:14px;
}
.syncbar .srow{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.syncbar input[type=text]{
  flex:1; min-width:120px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px;
  color:var(--ink-2); background:var(--page); border:1px solid var(--ring); border-radius:8px; padding:7px 10px;
}
.syncbar strong{color:var(--ink-1)}
/* Status reads as state before it reads as text: a dot carries on/pending/failed
   so you can tell at a glance without parsing the sentence. */
.sync-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.sync-head .spacer{flex:1; min-width:0}
.sync-dot{width:8px; height:8px; border-radius:50%; flex:none; background:var(--baseline)}
.sync-dot.on{background:var(--good)}
.sync-dot.pending{background:var(--warning)}
.sync-dot.error{background:var(--critical)}
.sync-stamp{color:var(--ink-muted); font-variant-numeric:tabular-nums}
.sync-sec, .sync-foot{padding-top:14px; border-top:1px solid var(--grid)}
.sync-sec{display:grid; gap:8px; justify-items:start}
.sync-foot{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.sync-label{font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-muted)}
.sync-note{margin:0; font-size:12.5px; color:var(--ink-muted); max-width:62ch}
.sync-line{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
/* Recessed rather than red: rotation is a considered action, not an alarm, and the
   consequence lives in the copy where it can be read. */
.sync-confirm{
  display:grid; gap:8px; width:100%; padding:12px; border-radius:9px;
  background:var(--chip-bg); border:1px solid var(--ring);
}
.sync-confirm .sync-note{max-width:58ch}
.sync-confirm strong{color:var(--ink-1)}
.sync-line .who{color:var(--ink-1); font-weight:600}
.syncbar .srow{width:100%}
.syncbar .kofi-nudge{margin-top:0; padding-top:14px; border-top:1px solid var(--grid); font-size:12.5px; color:var(--ink-muted)}
.syncbar .ghost{
  padding:0; text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--grid);
}
.syncbar .ghost:hover{text-decoration-color:currentColor}
.syncbar :is(button,input,a):focus-visible{outline:2px solid var(--blue); outline-offset:2px; border-radius:6px}
/* ---- recall + katas ---- */
.kata .prob-head{cursor:pointer}
.kq{font-weight:600; font-size:15px}
.klang{font-size:11px; font-weight:700; padding:1px 8px; border-radius:999px; background:var(--blue-soft); color:var(--seq-650)}
:root[data-theme="dark"] .klang{color:var(--ink-1)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .klang{color:var(--ink-1)} }
.kdraft{font-size:11px; font-weight:700; padding:1px 8px; border-radius:999px; background:var(--warning); color:#3a2a00}
.kbody{margin-top:12px; padding-top:12px; border-top:1px solid var(--grid)}
.editor{
  width:100%; min-height:120px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:13px; line-height:1.55; tab-size:2; white-space:pre; overflow-wrap:normal; overflow-x:auto;
  background:var(--page); color:var(--ink-1); border:1px solid var(--ring); border-radius:9px; padding:10px 12px;
}
.editor:focus{outline:2px solid var(--blue); outline-offset:-1px}
.medwrap{position:relative}
.med{
  height:190px; min-height:120px; border:1px solid var(--ring); border-radius:9px; overflow:hidden;
  resize:vertical; background:var(--page);
}
.med .monaco-editor, .med .monaco-editor .margin, .med .monaco-editor-background{background:transparent}
.reveal pre .mtk1{color:var(--ink-1)}
.runrow{display:flex; gap:8px; align-items:center; margin-top:9px; flex-wrap:wrap}
.runrow .hint{font-size:12px; color:var(--ink-muted)}
.out{
  margin-top:9px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px;
  background:var(--chip-bg); border-radius:9px; padding:9px 12px; white-space:pre-wrap; color:var(--ink-2);
  max-height:220px; overflow:auto;
}
.out.pass{border-left:3px solid var(--good)}
.out.fail{border-left:3px solid var(--critical)}
.out .ok{color:var(--good-text); font-weight:700}
.out .err{color:var(--critical); font-weight:700}
.out table{border-collapse:collapse; font-size:12px}
.out td,.out th{border:1px solid var(--grid); padding:3px 8px; text-align:left}
.reveal{margin-top:10px}
.reveal pre{
  margin:0; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px;
  background:var(--chip-bg); border-radius:9px; padding:10px 12px; overflow-x:auto; color:var(--ink-1);
}
.kgrade{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap}
.kaddform{background:var(--surface-1); border:1px solid var(--ring); border-radius:12px; padding:14px 16px; margin-bottom:16px}
.kaddform .frow{display:flex; gap:10px; margin-bottom:9px; flex-wrap:wrap}
.kaddform input[type=text], .kaddform select{
  font-family:inherit; font-size:14px; color:var(--ink-1); background:var(--page);
  border:1px solid var(--ring); border-radius:8px; padding:7px 10px;
}
.kaddform input[type=text]{flex:1; min-width:220px}
.kcapture{margin-top:10px; padding-top:10px; border-top:1px dashed var(--grid)}
.kcapture label{font-size:12.5px; color:var(--ink-muted); display:block; margin-bottom:5px}
.kcapture .frow{display:flex; gap:8px; flex-wrap:wrap}
.kcapture input[type=text]{
  flex:1; min-width:200px; font-family:inherit; font-size:13.5px; color:var(--ink-1);

}

.toast.rich{pointer-events:auto}
.toast a{color:inherit}
.newlist .card{padding:10px 16px}

   forever. Never backfill an id during migrate() — two devices would mint
   different ids for the same historical attempt and the union would duplicate all
   of it. The `i:` prefix can't collide with a composite, which always has a `|`. */
const lkey = (a) => (typeof a.i === "string" && a.i) ? `i:${a.i}` : `${a.pid}|${a.d}|${a.r}`;

  const legacy = validTime(st.prefT);

  return {

function migrate(st){
  if(!st || typeof st!=='object') st = {};
  if(!Array.isArray(st.log)) st.log = [];
  st.dismissed = [...new Set((Array.isArray(st.dismissed)?st.dismissed:[])
    .filter(id=>Number.isInteger(id) && id>=1 && id<=PROBLEMS.length))].sort((a,b)=>a-b);
  if(!Number.isInteger(st.newPerDay) || st.newPerDay<1 || st.newPerDay>20) st.newPerDay = 2;
  if(![75,150,250].includes(st.tier)) st.tier = 150;
  if(st.linkPref!=='nc' && st.linkPref!=='lc') st.linkPref = 'nc';
  if(!Array.isArray(st.katas)) st.katas = [];
  if(!Array.isArray(st.klog)) st.klog = [];
  if(!Number.isFinite(st.nextKataId)) st.nextKataId = 1 + st.katas.reduce((m,k)=>Math.max(m,k.id||0),0);
  // sync bookkeeping: tombstones let deletions survive a merge instead of being
  // resurrected by the other device's copy. Each preference is its own LWW register,
  // so changing "solve on" can never clobber skips made on another device.
  if(!Array.isArray(st.deletedLog)) st.deletedLog = [];
  if(!Array.isArray(st.deletedKlog)) st.deletedKlog = [];
  if(!Array.isArray(st.kataTombs)) st.kataTombs = [];
  st.prefT = validTime(st.prefT); // legacy compatibility; new code uses prefTs
  st.prefTs = normalizePrefTs(st);
  return st;
}
function touchPref(name){

/* Deck item ids used to be a counter — two offline devices would both mint id 5 and the
   merge would clobber one. Time+jitter keeps ids numeric (handlers Number() them);
   the uniqueness loop matters when minting many in one millisecond (bulk seeding
   drew duplicates from the 1000-value jitter alone). */
function genId(){
  let id;
  do { id = Date.now()*1000 + Math.floor(Math.random()*1000); }
  while (state && (state.katas.some(k=>k.id===id) || (state.kataTombs||[]).includes(id)));
  return id;
}
/* Short on purpose: this rides on every attempt and the state has a 900KB ceiling.
   Random, not time-based, so two offline devices never mint the same one. */
function attemptId(){
  const b = new Uint8Array(6); crypto.getRandomValues(b);
  return [...b].map(x=>x.toString(16).padStart(2,'0')).join('');
}

   localStorage stays the source of truth; the server holds the merged union of every
   device that shares the key. Offline, nothing changes — pushes just fail quietly and
   the next successful round-trip converges. The key is a 128-bit capability: pairing
   is "open this link on the other machine", same trust model as a private gist URL. */
const SYNC_URL = 'https://kindred-eel-975.convex.site/sync';
const GOOGLE_CLIENT_ID = '635673772405-6v6biu4bio4cs1g33odimg40a65knhfa.apps.googleusercontent.com';
const SYNC_KEY_LS = 'ncsr-sync-key';
const GOOGLE_EMAIL_LS = 'ncsr-google-email';
let syncTimer=null, syncState='off';   // off | ok | dirty | error
let syncStamp=null;
function syncKey(){ return localStorage.getItem(SYNC_KEY_LS) || null; }
function newSyncKey(){
  const b = new Uint8Array(16); crypto.getRandomValues(b);

function pushSoon(){
  if(!syncKey()) return;
  // The key is gone, not unreachable — retrying can only fail, and every retry
  // repaints a scary status the user can't act on.
  if(syncState==='revoked') return;
  syncState='dirty'; paintSync();
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncNow, 1500);
}
/* Client-side twin of the server merge. The merge is commutative and idempotent, so
   running it on both ends is safe — and it closes a lost-update race: anything logged
   while a sync request is in flight would otherwise be wiped when the response
   replaced `state` wholesale. */
function canonical(v){
  if(Array.isArray(v)) return `[${v.map(canonical).join(',')}]`;
  if(v && typeof v==='object') return `{${Object.keys(v).sort().map(k=>`${JSON.stringify(k)}:${canonical(v[k])}`).join(',')}}`;
  return JSON.stringify(v) ?? 'undefined';
}
function mergeStates(a,b){
  a=migrate({...a}); b=migrate({...b});
  const deadLog = new Set([...(a.deletedLog||[]), ...(b.deletedLog||[])]);
  const deadKlog = new Set([...(a.deletedKlog||[]), ...(b.deletedKlog||[])]);
  const deadKata = new Set([...(a.kataTombs||[]), ...(b.kataTombs||[])]);
  const unionBy=(x,y,keyFn,dead)=>{
    const out=new Map();
    for(const e of [...(x||[]), ...(y||[])]){
      const k=keyFn(e); if(dead.has(k)) continue;
      const prev=out.get(k);
      const richer=(e.n||'').length-(prev?.n||'').length;
      if(!prev || richer>0 || (richer===0 && canonical(e)>canonical(prev))) out.set(k,e);
    }
    return [...out.values()].sort((m,n)=>{
      const mid=m.pid??m.kid, nid=n.pid??n.kid;
      return m.d<n.d?-1:m.d>n.d?1:mid<nid?-1:mid>nid?1:keyFn(m).localeCompare(keyFn(n));
    });
  };
  const katas=new Map();
  for(const k of [...(a.katas||[]), ...(b.katas||[])]){
    if(deadKata.has(k.id)) continue;
    const prev=katas.get(k.id);
    if(!prev || (k.u||0)>(prev.u||0) || ((k.u||0)===(prev.u||0) && canonical(k)>canonical(prev))) katas.set(k.id,k);
  }
  const pref=(name)=>{
    const at=a.prefTs[name]||0, bt=b.prefTs[name]||0;
    if(at!==bt) return at>bt?a[name]:b[name];
    return canonical(a[name])>=canonical(b[name]) ? a[name] : b[name];
  };
  const prefTs=Object.fromEntries(['dismissed','newPerDay','tier','linkPref']
    .map(name=>[name,Math.max(a.prefTs[name]||0,b.prefTs[name]||0)]));
  return migrate({
    log: unionBy(a.log,b.log,lkey,deadLog),
    klog: unionBy(a.klog,b.klog,kkey,deadKlog),
    katas: [...katas.values()].sort((m,n)=>String(m.id).localeCompare(String(n.id),undefined,{numeric:true})),
    dismissed: pref('dismissed'), newPerDay: pref('newPerDay'),
    tier: pref('tier'), linkPref: pref('linkPref'), prefTs,
    prefT: Math.max(a.prefT||0,b.prefT||0),
    deletedLog:[...deadLog].sort(), deletedKlog:[...deadKlog].sort(),
    kataTombs:[...deadKata].sort((m,n)=>String(m).localeCompare(String(n),undefined,{numeric:true})),
    nextKataId: Math.max(a.nextKataId||1, b.nextKataId||1),
  });
}
let syncInFlight=null;
async function syncNow(){
  const key = syncKey(); if(!key) return;
  if(syncInFlight) return syncInFlight;
  const request = (async()=>{
    const sentSnapshot = JSON.stringify(state);
    try{
      const res = await fetch(SYNC_URL, {method:'POST', headers:{'Content-Type':'application/json'},
        body: `{"key":${JSON.stringify(key)},"state":${sentSnapshot}}`});
      // 410 is terminal, unlike every other failure here: this key was rotated away
      // and no amount of retrying brings it back. Local data is never touched — it
      // is the only copy this device still has, and it rides across on re-pairing.
      if(res.status===410){
        syncState='revoked'; clearTimeout(syncTimer);
        paintSync(); paintSyncbar();
        return;
      }
      if(!res.ok) throw new Error('HTTP '+res.status);
      const serverMerged = migrate((await res.json()).state);
      // merge into *current* state — it may have moved while the request is in flight
      const next = mergeStates(state, serverMerged);
      if(JSON.stringify(next) !== JSON.stringify(state)){
        state = next;
        try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
        render();
      }
      syncState='ok'; syncStamp=new Date();
      // if local changes landed mid-flight, the server doesn't have them yet — push again
      if(JSON.stringify(state) !== sentSnapshot && JSON.stringify(state) !== JSON.stringify(serverMerged)){
        clearTimeout(syncTimer); syncTimer=setTimeout(syncNow, 400);
      }
    }catch(e){
      syncState='error';
    }
    paintSync();
  })();
  syncInFlight=request;
  try{ await request; }
  finally{ if(syncInFlight===request) syncInFlight=null; }
}
function paintSync(){
  const el=document.getElementById('syncBtn'); if(!el) return;
  el.textContent = syncState==='off' ? 'Sync' :
    syncState==='ok' ? `Sync ✓` : syncState==='dirty' ? 'Sync …' : 'Sync ⚠';
  el.title = syncState==='off' ? 'Set up cross-device sync' :
    syncState==='ok' ? `Synced ${syncStamp?syncStamp.toLocaleTimeString():''}` :
    syncState==='dirty' ? 'Changes pending' :
    syncState==='revoked' ? 'Disconnected — the sync link was rotated' :
    'Sync failed — will retry on next change';
  // Refresh only the status line, so an open panel tracks sync state live without
  // tearing down the Google button iframe or resetting the revealed pairing link.
  const head=document.getElementById('syncHead');
  if(head) head.innerHTML = syncHeadHTML();
}

let googleIdentityPromise=null;
function googleConfigured(){ return GOOGLE_CLIENT_ID!=='PLACEHOLDER_CLIENT_ID'; }
function googleEmail(){ return googleConfigured() ? localStorage.getItem(GOOGLE_EMAIL_LS) : null; }
function loadGoogleIdentity(){
  if(!googleConfigured()) return Promise.resolve(false);
  if(googleIdentityPromise) return googleIdentityPromise;
  googleIdentityPromise = new Promise((resolve,reject)=>{
    const ready=()=>{
      try{
        google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID, callback:adoptGoogleCredential});
        resolve(true);
      }catch(err){ reject(err); }
    };
    if(window.google?.accounts?.id) return ready();
    const script=document.createElement('script');
    script.src='https://accounts.google.com/gsi/client';
    script.async=true;
    script.onload=ready;
    script.onerror=()=>reject(new Error('Google Identity Services failed to load'));
    document.head.appendChild(script);
  });
  return googleIdentityPromise;
}

function emailFromGoogleCredential(credential){
  try{
    const part=credential.split('.')[1];
    const raw=atob(part.replace(/-/g,'+').replace(/_/g,'/').padEnd(Math.ceil(part.length/4)*4,'='));
    const payload=JSON.parse(new TextDecoder().decode(Uint8Array.from(raw,c=>c.charCodeAt(0))));
    return typeof payload.email==='string' && payload.email ? payload.email : 'Google account';
  }catch(_){ return 'Google account'; }
}
async function post(path, body){
  const res=await fetch(new URL(path,SYNC_URL), {method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)});
  const result=await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(result.error||`HTTP ${res.status}`);
  return result;
}
async function adoptGoogleCredential(response){
  const credential=response?.credential;
  if(typeof credential!=='string' || !credential) return toast('Could not sign in — try again');
  try{
    const email=emailFromGoogleCredential(credential);
    const local = syncKey();
    // A revoked key can't be flushed to and must not be offered for adoption — this
    // is the sign-in that *recovers* a rotated-out device, so skip straight to
    // /recover and let the push afterwards carry the local log into the new key.
    const revoked = syncState==='revoked';
    // Flush this browser's lineage to its own key before adopting the account key —
    // syncNow() only ever pushes the currently selected key, so anything still local
    // would be stranded under the old one. syncNow() swallows its errors, so check
    // the resulting state rather than relying on it to throw.
    if(local && !revoked){
      await syncNow();
      if(syncState==='error') return toast('Could not reach sync — not signing in until this device is caught up');
    }
    const {key} = await post('/recover', {credential, key: revoked ? null : local});
    if(typeof key!=='string' || !/^[a-f0-9]{32,64}$/.test(key)) throw new Error('Bad recovery key');
    if(key !== local){
      if(local) localStorage.setItem('ncsr-sync-key-prev', local);
      localStorage.setItem(SYNC_KEY_LS, key);
    }
    // Clear the terminal verdict before pushing: it belonged to the key we just
    // replaced, and leaving it set would keep pushSoon() muted on a live key.
    if(revoked) syncState='off';
    await syncNow();
    try{ localStorage.setItem(GOOGLE_EMAIL_LS, email); }catch(_){}
    paintSync(); paintSyncbar();
    toast('Signed in — your log is recoverable on any device');
  }catch(_){ toast('Could not sign in — try again'); }
}
/* Retire this device's key and adopt its replacement. The server copies the state
   across and tombstones the old key inside one transaction, so the only thing left
   to do here is store what comes back — and push, so anything logged locally since
   the last sync lands under the new key too. */
async function rotateSyncKey(){
  const key = syncKey();
  if(!key) return;
  try{
    // Flush first: the old key dies the moment the server responds, and anything
    // still local would otherwise only exist in this browser.
    await syncNow();
    const {key:rotated} = await post('/rotate', {key});
    if(typeof rotated!=='string' || !/^[a-f0-9]{32,64}$/.test(rotated)) throw new Error('bad key');
    localStorage.setItem(SYNC_KEY_LS, rotated);
    syncState='off';
    await syncNow();
    // Reveal it once — a link nobody can read is a link nobody can re-pair with.
    pairLinkShown = true;
    paintSync(); paintSyncbar();
    toast('Link rotated — copy the new one to your other devices', {ms:5000});
  }catch(_){
    paintSyncbar();
    toast('Could not rotate the link — nothing changed');
  }
}

/* ---------- scheduler: SM-2 adapted ----------
   ease starts 2.5.
   video (couldn't solve): interval=1, ease-0.2       -> redo tomorrow
   hints (solved w/ help): interval=2, ease-0.15      -> redo in 2 days
   cold  (solved solo):    first time -> 7 days,
                           after: max(7, round(interval*ease)), ease+0.05, cap 120d
----------------------------------------------- */
function schedule(attempts){
  let ease=2.5, interval=0, due=null;
  for(const a of attempts){
    if(a.r==='cold'){ interval = interval===0 ? 7 : Math.min(120, Math.max(7, Math.round(interval*ease))); ease=Math.min(2.8, ease+0.05); }
    else if(a.r==='hints'){ interval=2; ease=Math.max(1.3, ease-0.15); }
    else { interval=1; ease=Math.max(1.3, ease-0.2); }
    due = addDays(a.d, interval);
  }
  return {ease, interval, due, last: attempts[attempts.length-1]||null, n: attempts.length};
}
function previewNext(st, r){
  let {ease=2.5, interval=0} = st.n? st : {};
  if(r==='cold') return st.n===0||interval===0 ? 7 : Math.min(120, Math.max(7, Math.round(interval*ease)));
  if(r==='hints') return 2;
  return 1;
}
function attemptsFor(pid){ return state.log.filter(a=>a.pid===pid).sort((a,b)=>a.d<b.d?-1:1); }
function pstate(p){
  const at = attemptsFor(p.id);
  if(!at.length) return {status:'new', n:0, due:null, interval:0, ease:2.5, last:null};
  const s = schedule(at);
  const t = todayStr();
  let status = 'scheduled';
  if(s.due <= t) status = 'due';
  else if(s.interval >= 30) status = 'solid';
  return {status, ...s};
}

/* ---------- derived ---------- */
const NEW_GATE = 6;          // stop serving new problems while this many reviews are due (Anki's backlog rule)
const INTERLEAVE_AFTER = 3;  // start rotating categories once this many patterns are in play

function isDismissed(pid){ return (state.dismissed||[]).includes(pid); }

/* A problem is a leech once 2 of its last 3 attempts needed help. Repeated failure
   means the encoding is wrong, so re-attempting it cold just burns another rep. */
function leechInfo(pid){
  const at = attemptsFor(pid);
  if(at.length < 3) return null;
  const last3 = at.slice(-3);
  const bad = last3.filter(a=>a.r!=='cold').length;
  return bad >= 2 ? {bad, n: at.length} : null;
}

function allDue(){
  const t = todayStr();
  return PROBLEMS.map(p=>({p, s:pstate(p)}))
    .filter(x=>x.s.n>0 && x.s.due<=t)
    .sort((a,b)=> a.s.due<b.s.due?-1 : a.s.due>b.s.due?1 : 0);
}
function dueList(){ return allDue().filter(x=>!leechInfo(x.p.id)); }
function leechList(){ return allDue().filter(x=>leechInfo(x.p.id)); }

function unseen(){ return activePool().filter(p=>attemptsFor(p.id).length===0 && !isDismissed(p.id)); }
function touchedCats(){ return new Set(activePool().filter(p=>attemptsFor(p.id).length>0).map(p=>p.cat)); }

/* Interleaved new queue. Rohrer's RCT: practice mixed across patterns beats practice
   blocked by pattern (d≈0.83), because interviews never tell you which pattern applies.
   Problems from patterns you've already met come first — but never two in a row from
   the same one, once you have enough patterns in play to rotate. */
function newQueue(limit){
  const touched = touchedCats();
  const sorted = unseen().filter(p=>!pendingTransfer.has(p.id))
    .sort((a,b)=> (touched.has(a.cat)?0:1)-(touched.has(b.cat)?0:1) || byOrd(a,b));
  if(touched.size < INTERLEAVE_AFTER) return sorted.slice(0, limit);
  const out=[], pool=[...sorted];
  let lastCat=null;
  while(out.length<limit && pool.length){
    let i = pool.findIndex(p=>p.cat!==lastCat);
    if(i<0) i=0;
    lastCat = pool[i].cat;
    out.push(pool.splice(i,1)[0]);
  }
  return out;
}

/* Transfer test: re-solving a problem you've already owned twice tests recognition.
   Solving an unseen sibling in the same pattern tests the thing interviews test. */
function transferSibling(p){
  const at = attemptsFor(p.id);
  if(at.length < 3 || at.filter(a=>a.r==='cold').length < 2) return null;
  if(leechInfo(p.id)) return null;
  return activePool().filter(q=>q.cat===p.cat && q.id!==p.id && !isDismissed(q.id) && attemptsFor(q.id).length===0)
    .sort(byOrd)[0] || null;
}
function streak(){
  const days = new Set(state.log.map(a=>a.d));
  let s=0, d=todayStr();
  if(!days.has(d)) d=addDays(d,-1);
  while(days.has(d)){ s++; d=addDays(d,-1); }
  return s;
}

/* Course order and chapter live here, keyed by dsa name, so already-seeded decks
   (synced state predates this metadata) pick it up without a migration. */
const DSA_META = Object.fromEntries(DSA_SET.map(([name,,chapter,slug],i)=>[name,{ord:i,chapter,slug}]));
const dsaOrd = k => (k.dsa && DSA_META[k.dsa]) ? DSA_META[k.dsa].ord : Infinity;
function seedDSA(){
  const have = new Set(state.katas.map(k=>k.dsa).filter(Boolean));
  let added=0;
  for(const [name,desc] of DSA_SET){
    if(have.has(name)) continue;
    state.katas.push({id: genId(), q:`Implement ${name} — ${desc}`, a:'', lang:'typescript',
      kind:'repo', dsa:name, test:'', setup:'', starter:'', u: Date.now(), src:null, created: todayStr()});
    added++;
  }
  save();
  return added;
}

function kschedule(attempts, kind){
  const drill = kind==='repo';
  let ease=2.5, interval=0, due=null;
  for(const a of attempts){
    if(a.r==='instant'){
      interval = drill
        ? (interval===0 ? 7 : Math.min(180, Math.max(7, Math.round(interval*ease))))
        : (interval===0 ? 2 : Math.min(365, Math.max(2, Math.round(interval*ease))));
      ease = Math.min(3.0, ease+0.05);
    } else if(a.r==='slow'){
      interval = Math.max(drill?3:1, Math.round(interval*1.2));
      ease = Math.max(1.3, ease-0.10);
    } else {
      interval = drill?2:1;
      ease = Math.max(1.3, ease-0.25);
    }
    due = addDays(a.d, interval);
  }
  return {ease, interval, due, last: attempts[attempts.length-1]||null, n: attempts.length};
}
function kstate(k){
  const at = kAttempts(k.id);
  if(!at.length) return {status:'new', n:0, due:null, interval:0, ease:2.5, last:null};
  const s = kschedule(at, k.kind);
  return {status: s.due<=todayStr() ? 'due' : (s.interval>=60?'solid':'scheduled'), ...s};
}
function kpreview(k, st, r){
  const drill = isDrill(k);
  const {ease=2.5, interval=0} = st.n? st : {};
  if(r==='instant') return drill
    ? (interval===0 ? 7 : Math.min(180, Math.max(7, Math.round(interval*ease))))
    : (interval===0 ? 2 : Math.min(365, Math.max(2, Math.round(interval*ease))));
  if(r==='slow') return Math.max(drill?3:1, Math.round(interval*1.2));
  return drill?2:1;
}
/* The same leech signal needs a different prescription: split malformed recall cards;
   rebuild the mental model behind an implementation form. */
function kLeech(kid){
  const at = kAttempts(kid);
  if(at.length < 3) return null;
  const bad = at.slice(-3).filter(a=>a.r!=='instant').length;
  return bad >= 2 ? {bad} : null;
}
function kataDue(track){
  const deck = trackKatas(track);
  const t = todayStr();
  const due = deck.filter(k=>!isDraft(k)).map(k=>({k, s:kstate(k)}))
    .filter(x=>x.s.n>0 && x.s.due<=t)
    .sort((a,b)=> a.s.due<b.s.due?-1 : a.s.due>b.s.due?1 : 0);
  const fresh = deck.filter(k=>!isDraft(k) && kAttempts(k.id).length===0).map(k=>({k, s:kstate(k)}));
  if(track==='drills') fresh.sort((a,b)=>dsaOrd(a.k)-dsaOrd(b.k));
  const queue = [...due, ...fresh];
  return track==='recall' ? interleaveLang(queue) : queue;
}
/* Same Rohrer logic as the problem queue: five TypeScript recall cards in a row lets you
   coast on primed context. Switching languages is the discrimination the job asks for. */
function interleaveLang(items){
  if(new Set(items.map(x=>x.k.lang)).size < 2) return items;
  const out=[], pool=[...items];
  let lastLang=null;
  while(pool.length){
    let i = pool.findIndex(x=>x.k.lang!==lastLang);
    if(i<0) i=0;
    lastLang = pool[i].k.lang;
    out.push(pool.splice(i,1)[0]);
  }
  return out;
}

/* ---------- code runtimes (lazy-loaded, per language) ---------- */
const loaded = {};
function loadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('Could not load '+src));
    document.head.appendChild(s);
  });
}
const TS_CDN = 'https://cdn.jsdelivr.net/npm/typescript@5.6.3/lib/';
// Without a standard library every `Map` reads as an unknown name, so the typechecker
// emits pure noise. These are the lib files that make it mean something — ~39KB gzipped.
const TS_LIBS = ['lib.es5.d.ts','lib.es2015.core.d.ts','lib.es2015.collection.d.ts','lib.es2015.iterable.d.ts',
  'lib.es2015.symbol.d.ts','lib.es2015.symbol.wellknown.d.ts','lib.es2015.promise.d.ts','lib.es2015.generator.d.ts',
  'lib.es2017.object.d.ts','lib.es2019.array.d.ts','lib.es2020.bigint.d.ts'];
async function needTS(){
  if(!loaded.ts){
    await loadScript(TS_CDN+'typescript.js');
    const parts = await Promise.all(TS_LIBS.map(f=>fetch(TS_CDN+f).then(r=>r.ok?r.text():'').catch(()=>'')));
    // assert/eq are injected at runtime; declare them here so the checker doesn't
    // flag them, and so k.ts line numbers stay honest.
    loaded.tsLib = parts.join('\n').replace(/^\/\/\/\s*<reference.*$/gm,'')
      + '\ndeclare function assert(cond: any, msg?: string): void;'
      + '\ndeclare function eq(actual: any, expected: any, msg?: string): boolean;';
    loaded.ts=true;
  }
  return window.ts;
}
async function needSQL(){
  if(!loaded.sql){
    await loadScript('https://cdn.jsdelivr.net/npm/sql.js@1.11.0/dist/sql-wasm.js');
    loaded.sqlDb = await window.initSqlJs({locateFile: f=>'https://cdn.jsdelivr.net/npm/sql.js@1.11.0/dist/'+f});
    loaded.sql=true;
  }
  return loaded.sqlDb;
}

/* ---------- Monaco (VS Code's editor) — progressive enhancement ----------
   The plain textarea stays in the markup as the fallback; when Monaco loads we mount
   over it. TS/JS get the real language service (completions, hover, live squiggles),
   everything else gets syntax highlighting. If the CDN is unreachable, the textarea
   keeps working and Run still typechecks — nothing depends on Monaco.
--------------------------------------------------------------------------- */
const MONACO_BASE = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/';
const MLANG = {javascript:'javascript', typescript:'typescript', sql:'sql', python:'python', go:'go', rust:'rust', shell:'shell', other:'plaintext'};
const monacoEds = new Map();   // kid -> editor instance
let monacoState = 'idle';      // idle | loading | ready | failed
function monacoTheme(){
  const t = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  return t==='dark' ? 'vs-dark' : 'vs';
}
function needMonaco(){
  if(monacoState==='ready') return Promise.resolve(window.monaco);
  if(monacoState==='failed') return Promise.reject(new Error('monaco unavailable'));
  if(loaded.monacoP) return loaded.monacoP;
  monacoState='loading';
  loaded.monacoP = new Promise((res,rej)=>{
    // Workers can't be created cross-origin directly; the standard fix is a same-origin
    // blob that importScripts the CDN worker.
    window.MonacoEnvironment = { getWorkerUrl: () => URL.createObjectURL(new Blob(
      [`self.MonacoEnvironment={baseUrl:'${MONACO_BASE}'};importScripts('${MONACO_BASE}vs/base/worker/workerMain.js');`],
      {type:'text/javascript'})) };
    loadScript(MONACO_BASE+'vs/loader.js').then(()=>{
      window.require.config({paths:{vs: MONACO_BASE+'vs'}});
      window.require(['vs/editor/editor.main'], ()=>{
        const m = window.monaco;
        const opts = {target: m.languages.typescript.ScriptTarget.ES2020, strict:false, allowNonTsExtensions:true, noEmit:true};
        m.languages.typescript.typescriptDefaults.setCompilerOptions(opts);
        m.languages.typescript.javascriptDefaults.setCompilerOptions({...opts, allowJs:true, checkJs:false});
        const globals = 'declare function assert(cond: any, msg?: string): void;\ndeclare function eq(actual: any, expected: any, msg?: string): boolean;';
        m.languages.typescript.typescriptDefaults.addExtraLib(globals, 'ts:kata-globals.d.ts');
        m.languages.typescript.javascriptDefaults.addExtraLib(globals, 'ts:kata-globals.d.ts');
        monacoState='ready'; res(m);
      }, err=>{ monacoState='failed'; rej(err); });
    }).catch(err=>{ monacoState='failed'; rej(err); });
  });
  return loaded.monacoP;
}
/* render() rebuilds the DOM wholesale, so editors from the previous render are orphaned —
   dispose them all, then mount fresh into whatever's open now. */
function disposeKataEditors(){
  for(const ed of monacoEds.values()){ try{ ed.getModel()?.dispose(); ed.dispose(); }catch(_){} }
  monacoEds.clear();
}
function enhanceKataEditors(){
  const tas = [...view.querySelectorAll('textarea[data-keditor]')];
  const reveals = [...view.querySelectorAll('.reveal pre[data-lang]')];
  if(!tas.length && !reveals.length) return;
  needMonaco().then(m=>{
    m.editor.setTheme(monacoTheme());
    for(const ta of tas){
      const kid = Number(ta.dataset.keditor);
      const k = kataById(kid); if(!k || monacoEds.has(kid)) continue;
      const wrap = document.createElement('div');
      wrap.className='med';
      ta.replaceWith(wrap);
      const uri = m.Uri.parse(`inmemory://kata/${kid}.${k.lang==='typescript'?'ts':k.lang==='javascript'?'js':'txt'}`);
      m.editor.getModel(uri)?.dispose();
      const ed = m.editor.create(wrap, {
        model: m.editor.createModel(ta.value, MLANG[k.lang]||'plaintext', uri),
        automaticLayout:true, minimap:{enabled:false}, fontSize:13, lineNumbers:'on',
        scrollBeyondLastLine:false, tabSize:2, folding:false, wordWrap:'off',
        renderLineHighlight:'none', fixedOverflowWidgets:true, scrollbar:{alwaysConsumeMouseWheel:false},
        padding:{top:10,bottom:10}, fontFamily:'ui-monospace,SFMono-Regular,Menlo,Consolas,monospace',
      });
      ed.onDidChangeModelContent(()=>kataDraft.set(kid, ed.getValue()));
      ed.addCommand(m.KeyMod.CtrlCmd | m.KeyCode.Enter, ()=>runKataFromUI(kid));
      monacoEds.set(kid, ed);
    }
    for(const pre of reveals){
      if(pre.dataset.colorized) continue;
      pre.dataset.colorized='1';
      m.editor.colorizeElement(pre, {theme: monacoTheme(), mimeType: MLANG[pre.dataset.lang]||'plaintext', tabSize:2});
    }
  }).catch(()=>{}); // textarea fallback stays in place
}

function runJS(code, test){
  const logs=[];
  const fakeConsole={log:(...a)=>logs.push(a.map(fmtVal).join(' ')), error:(...a)=>logs.push('Error: '+a.map(fmtVal).join(' ')), warn:(...a)=>logs.push(a.map(fmtVal).join(' '))};
  const assert=(cond,msg)=>{ if(!cond) throw new Error(msg||'Assertion failed'); };
  const eq=(a,b,msg)=>{ const A=JSON.stringify(a),B=JSON.stringify(b);
    if(A!==B) throw new Error((msg||'Expected')+`\n  expected: ${B}\n  actual:   ${A}`); return true; };
  try{
    new Function('console','assert','eq', code + (test?`\n;{\n${test}\n}`:''))(fakeConsole, assert, eq);
    return {ok:true, logs, tested:!!test};
  }catch(e){
    return {ok:false, logs, tested:!!test, error:(e&&e.message)||String(e)};
  }
}
function fmtVal(v){
  if(v instanceof Map) return 'Map('+v.size+') {'+[...v].map(([k,x])=>` ${JSON.stringify(k)} => ${fmtVal(x)}`).join(',')+' }';
  if(v instanceof Set) return 'Set('+v.size+') {'+[...v].map(fmtVal).join(', ')+'}';
  if(typeof v==='string') return v;
  try{ return JSON.stringify(v); }catch(_){ return String(v); }
}
async function runTS(code, test){
  const ts = await needTS();
  const full = code + (test?`\n;{\n${test}\n}`:'');
  const out = ts.transpileModule(full, {compilerOptions:{target:ts.ScriptTarget.ES2020, module:ts.ModuleKind.None}, reportDiagnostics:true});
  // Real typechecking, not just type-stripping — for a TS recall card, "is this valid TS"
  // is most of the question.
  const files = {'k.ts': full, 'lib.d.ts': loaded.tsLib||''};
  const host = {
    getSourceFile:(n,l)=> files[n]!==undefined ? ts.createSourceFile(n, files[n], l) : undefined,
    writeFile:()=>{}, getDefaultLibFileName:()=>'lib.d.ts', useCaseSensitiveFileNames:()=>true,
    getCanonicalFileName:f=>f, getCurrentDirectory:()=>'', getNewLine:()=>'\n',
    fileExists:f=>files[f]!==undefined, readFile:f=>files[f],
  };
  let typeErrs=[];
  try{
    const prog = ts.createProgram(['k.ts'], {noEmit:true, target:ts.ScriptTarget.ES2020, strict:false, noResolve:true}, host);
    typeErrs = ts.getPreEmitDiagnostics(prog)
      .filter(d=>d.file && d.file.fileName==='k.ts')
      .map(d=>{
        const pos = d.file.getLineAndCharacterOfPosition(d.start||0);
        return `line ${pos.line+1}: ${ts.flattenDiagnosticMessageText(d.messageText,' ')}`;
      });
  }catch(_){}
  const res = runJS(out.outputText, null);
  res.typeErrs = typeErrs;
  res.tested = !!test;
  if(typeErrs.length) res.ok = false;
  return res;
}
async function runSQL(code, setup){
  const SQL = await needSQL();
  const db = new SQL.Database();
  try{
    if(setup && setup.trim()) db.run(setup);
    const res = db.exec(code);
    db.close();
    if(!res.length) return {ok:true, sql:true, rows:null};
    const last = res[res.length-1];
    return {ok:true, sql:true, cols:last.columns, rows:last.values};
  }catch(e){
    try{ db.close(); }catch(_){}
    return {ok:false, sql:true, error:(e&&e.message)||String(e)};
  }
}
async function runKata(k, code){
  if(k.lang==='javascript') return runJS(code, k.test);
  if(k.lang==='typescript') return runTS(code, k.test);
  if(k.lang==='sql') return runSQL(code, k.setup);
  return {ok:false, error:'No in-browser runtime for '+langLabel(k.lang)+' — compare against the answer instead.'};
}
function renderOut(res){
  if(!res) return '';
  let cls = res.ok ? 'pass' : 'fail';
  let body = '';
  if(res.typeErrs && res.typeErrs.length) body += `<span class="err">Type errors</span>\n${esc(res.typeErrs.join('\n'))}\n\n`;
  if(res.sql){
    if(res.error) body += `<span class="err">SQL error</span>\n${esc(res.error)}`;
    else if(!res.rows) body += `<span class="ok">OK</span> — statement ran, no rows returned`;
    else body += `<table><tr>${res.cols.map(c=>`<th>${esc(String(c))}</th>`).join('')}</tr>`
      + res.rows.map(r=>`<tr>${r.map(v=>`<td>${esc(v===null?'NULL':String(v))}</td>`).join('')}</tr>`).join('') + `</table>`;
    return `<div class="out ${cls}">${body}</div>`;
  }
  if(res.logs && res.logs.length) body += esc(res.logs.join('\n')) + '\n';
  if(res.error) body += `<span class="err">${res.tested?'Test failed':'Error'}</span>\n${esc(res.error)}`;
  else if(res.tested) body += `<span class="ok">✓ Test passed</span>`;
  else if(!body) body += `<span class="ok">Ran clean</span> — no output`;
  return `<div class="out ${cls}">${body.trim()}</div>`;
}
