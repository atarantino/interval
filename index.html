  let body='';
  if(open){
    if(draft){
      body = `<div class="kbody"><div class="leech-box">This is a capture, not a card yet — it needs an answer before it can enter the queue.
        <div style="margin-top:8px"><button class="primary" data-kedit="${k.id}">Write the answer</button></div></div></div>`;
    } else {
      const revealed = kataRevealed.has(k.id);
      const out = kataOut.get(k.id);
      const runs = kataRuns.get(k.id)||0;
      const suggested = out && out.ok && k.test ? (runs<=1?'instant':'slow') : null;
      body = `<div class="kbody">`;
      if(leech){
        body += isDrill(k)
          ? `<div class="leech-box"><strong>${leech.bad} of the last 3 reviews weren't instant.</strong> This form hasn't encoded yet. Re-derive the algorithm on paper or reread the reference implementation before burning another rep; splitting doesn't apply to an implementation form.
            <div style="margin-top:8px"><button class="iconbtn" data-kedit="${k.id}">Edit drill</button></div></div>`
          : `<div class="leech-box"><strong>${leech.bad} of the last 3 reviews weren't instant.</strong> This recall card is probably asking two things at once — SuperMemo's minimum information principle. Split it into two narrower cards rather than drilling this one again.
            <div style="margin-top:8px"><button class="iconbtn" data-kedit="${k.id}">Edit / split</button></div></div>`;
      }
      if(isDrill(k)){
        body += `<div class="leech-box">Do this one in <a href="https://github.com/atarantino/kata-typescript" target="_blank" rel="noopener"><strong>kata-typescript</strong></a>, not here — real editor, real test runner:
          ${k.dsa?`<pre style="margin:8px 0 0; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px; background:var(--page); border-radius:8px; padding:8px 10px; overflow-x:auto">npm run generate -- ${esc(k.dsa)}</pre>
          <div style="margin-top:6px; font-size:12px; color:var(--ink-muted)">or <code>npm run due -- --generate</code> to scaffold everything due at once</div>`:''}
          <div style="margin-top:6px">Implement until vitest passes, then grade the hesitation: <strong>Instant</strong> means you typed it without stopping, not merely that the wall-clock time looked good.</div>
          ${meta?`<div style="margin-top:6px">Blanked on the idea? <a href="${COURSE_URL+meta.slug}/" target="_blank" rel="noopener">Rewatch the lesson — ${esc(meta.chapter)} ↗</a></div>`:''}</div>`;
      } else if(k.kind==='code'){
        const val = kataDraft.has(k.id) ? kataDraft.get(k.id) : (k.starter||'');
        body += `<textarea class="editor" data-keditor="${k.id}" spellcheck="false" placeholder="Write it from scratch…">${esc(val)}</textarea>
        <div class="runrow">
          ${canRun(k.lang)?`<button class="primary" data-krun="${k.id}">Run${k.test?' & test':''}</button>`:''}
          <button class="iconbtn" data-kreveal="${k.id}">${revealed?'Hide':'Reveal'} answer</button>
          <span class="hint">${canRun(k.lang)? (k.test?'⌘↵ to run — the test decides, not your gut':'⌘↵ to run') : langLabel(k.lang)+' can’t run in-browser — compare against the answer'}</span>
        </div>
        <div data-kout="${k.id}">${out?renderOut(out):''}</div>`;
      } else {
        body += `<div class="runrow"><button class="iconbtn" data-kreveal="${k.id}">${revealed?'Hide':'Reveal'} answer</button>
          <span class="hint">Say it out loud before you reveal — thinking "yeah I know this" is not retrieval</span></div>`;
      }
      if(revealed) body += `<div class="reveal"><pre data-lang="${esc(k.lang)}">${esc(k.a)}</pre></div>`;
      body += `<div class="kgrade">
        ${['instant','slow','blank'].map(r=>`<button class="rbtn${suggested===r?' selected':''}" data-kres="${k.id}|${r}">
          <span class="rt">${KRICON[r]} ${KRLABEL[r]}</span>
          <span class="rs">next in ${kpreview(k,s,r)}d</span></button>`).join('')}
      </div>`;
      body += `<div style="margin-top:8px"><button class="ghost" data-kedit="${k.id}">Edit</button><button class="ghost" data-kdel="${k.id}">Delete</button></div>`;
      body += `</div>`;
    }
  }
  return `<div class="card kata${leech?' leech':''}" data-kid="${k.id}">
    <div class="prob-head" data-ktoggle="${k.id}">
      <span class="kq">${esc(k.q)}</span>
      <span class="klang">${esc(langLabel(k.lang))}</span>
      ${draft?`<span class="kdraft">needs answer</span>`:''}
      ${leech?`<span class="leech-tag">leech</span>`:''}
      ${k.src?`<span class="prob-meta">from ${esc((PROBLEMS.find(p=>p.id===k.src)||{}).name||'')}</span>`:''}
      ${meta?`<a class="prob-meta" href="${COURSE_URL+meta.slug}/" target="_blank" rel="noopener" title="Open the lesson that builds this form on master.dev">${esc(meta.chapter)} ↗</a>`:''}
      ${s.last?`<span class="result-icon">${KRICON[s.last.r]} ${KRLABEL[s.last.r]} · ${nice(s.last.d)}</span>`:''}
      <span class="spacer"></span>
      ${dueBit}
    </div>${body}</div>`;
}

function kataFormHTML(track){
  const k = kataEditing ? kataById(kataEditing) : null;
  const v = k||{q:'',a:'',lang:'typescript',kind:'code',test:'',setup:'',starter:''};
  const drill = track==='drills' || isDrill(v);
  return `<div class="kaddform" data-kform>
    <div class="frow">
      <input type="text" data-kq placeholder="Prompt — one thing only, e.g. “counter map over a string[]”" value="${esc(v.q)}">
      <select data-klang>${KLANGS.map(l=>`<option value="${l.id}"${v.lang===l.id?' selected':''}>${l.label}${l.run?' ▸ runnable':''}</option>`).join('')}</select>
      <select data-kkind>
        ${drill
          ? `<option value="repo" selected>Repository kata — external</option>`
          : `<option value="code"${v.kind==='code'?' selected':''}>Code — type it</option>
             <option value="concept"${v.kind==='concept'?' selected':''}>Concept — reveal it</option>`}
      </select>
    </div>
    <textarea class="editor" data-ka placeholder="${drill?'Optional notes about the form.':'The answer. For code recall, this is your reference implementation.'}">${esc(v.a)}</textarea>
    <details class="notes" style="margin-top:9px"><summary>Optional — starter stub, assertion, SQL setup</summary>
      <div style="margin-top:8px">
        <textarea class="editor" data-kstarter style="min-height:60px" placeholder="Starter stub pre-filled into the editor (optional)">${esc(v.starter||'')}</textarea>
        <textarea class="editor" data-ktest style="min-height:60px; margin-top:8px" placeholder="Assertion for JS/TS — has assert(cond, msg) and eq(actual, expected). e.g. eq([...counter('aab')], [['a',2],['b',1]])">${esc(v.test||'')}</textarea>
        <textarea class="editor" data-ksetup style="min-height:60px; margin-top:8px" placeholder="SQL setup — CREATE TABLE + INSERTs that run before your query">${esc(v.setup||'')}</textarea>
      </div>
    </details>
    <div class="runrow">
      <button class="primary" data-ksubmit>${k?'Save changes':'Add recall'}</button>
      <button class="ghost" data-kcancel>Cancel</button>
    </div>
  </div>`;
}

function renderRecall(){
  const deck = trackKatas('recall');
  const due = kataDue('recall');
  const drafts = deck.filter(isDraft);
  const rest = deck.filter(k=>!isDraft(k) && !due.some(x=>x.k.id===k.id));
  let html='';
  const editingHere = kataEditing && !isDrill(kataById(kataEditing));
  if(kataAdding || editingHere) html += kataFormHTML('recall');
  else html += `<div style="margin-bottom:16px"><button class="primary" data-knew>+ New recall</button></div>`;

  if(drafts.length){
    html += `<h2>Captured — need answers <span class="badge">${drafts.length}</span></h2>
    <p class="sub">Caught mid-problem. Write the answer and it joins Recall.</p>`;
    html += drafts.map(k=>kataCard(k, kstate(k))).join('');
  }
  html += `<h2>Due + fresh <span class="badge">${due.length}</span></h2>`;
  html += due.length ? `<p class="sub">Mixed across languages on purpose — switching languages is the discrimination the work actually demands.</p>`+due.map(x=>kataCard(x.k,x.s)).join('')
    : `<div class="empty">${deck.length?'Nothing due.':'Recall starts empty. Capture one small thing from a problem log, or add a five-second prompt here.'}</div>`;
  if(rest.length){
    html += `<h2>Scheduled <span class="badge">${rest.length}</span></h2>`;
    html += rest.map(k=>kataCard(k, kstate(k))).join('');
  }
  return html;
}

function renderDrills(){
  const deck = trackKatas('drills');
  const due = kataDue('drills');
  const rest = deck.filter(k=>!due.some(x=>x.k.id===k.id)).sort((a,b)=>dsaOrd(a)-dsaOrd(b));
  const editingHere = kataEditing && isDrill(kataById(kataEditing));
  let html = editingHere ? kataFormHTML('drills') : '';
  if(!editingHere){
    const dsaSeeded = DSA_SET.every(([n])=>deck.some(k=>k.dsa===n));
    if(!dsaSeeded) html += `<div style="margin-bottom:16px"><button class="primary" data-kseed title="23 implementation forms, scheduled here and executed in ~/dev/kata-typescript">+ Seed 23 kata-machine forms</button></div>`;
  }
  html += `<h2>Due + fresh <span class="badge">${due.length}</span></h2>`;
  html += due.length
    ? `<p class="sub">One implementation form at a time. Grade the hesitation, not the minutes.</p>`+due.map(x=>kataCard(x.k,x.s)).join('')
    : `<div class="empty">${deck.length?'Nothing due.':'No katas yet. Seed the 23 kata-machine forms to start this track.'}</div>`;
  if(rest.length){
    html += `<h2>Scheduled <span class="badge">${rest.length}</span></h2>`;
    html += rest.map(k=>kataCard(k, kstate(k))).join('');
  }
  return html;
}

function renderToday(){
  const due = dueList();
  const leeches = leechList();
  const t = todayStr();
  const backlog = due.length + leeches.length;
  const gated = backlog >= NEW_GATE && !gateOverride;
  const newProbs = gated ? [] : newQueue(state.newPerDay||2);
  const doneToday = state.log.filter(a=>a.d===t).length;
  let html = '';

  // Deliberately not gated by the problem backlog: when 10 reviews feel like too much,
  // 90 seconds of atomic recall is still showing up, and the streak stays honest.
  // Katas are 10-minute forms now; their own tab owns that heavier queue.
  const kdue = kataDue('recall');
  if(kdue.length){
    html += `<h2>Warm-up <span class="badge">${kdue.length}</span></h2>
    <p class="sub">Small stuff, 10 seconds each. Type it from scratch — recognising the answer isn't the same as producing it.</p>`;
    html += kdue.slice(0,5).map(x=>kataCard(x.k,x.s)).join('');
    if(kdue.length>5) html += `<div class="sub" style="margin:6px 0 0">+${kdue.length-5} more in Recall</div>`;
  }

  if(leeches.length){
    html += `<h2>Leeches <span class="badge">${leeches.length}</span></h2>
    <p class="sub">These keep failing. Grinding them again wastes the rep — rebuild the idea first, then code it from the idea.</p>`;
    html += leeches.map(x=>probCard(x.p, x.s, {leech:true})).join('');
  }

  html += `<h2>Reviews due <span class="badge">${due.length}</span></h2>
  <p class="sub">Most overdue first. Try each one from a blank editor before peeking at your notes — the struggle is what builds retention.</p>`;
  html += due.length ? due.map(x=>probCard(x.p,x.s,{due:true})).join('') : `<div class="empty">Review queue is clear 🎉 ${doneToday?`You've logged ${doneToday} attempt${doneToday>1?'s':''} today.`:'Pick up a new problem below.'}${doneToday?`<span class="kofi-nudge">If this trainer is working for you, <a href="https://ko-fi.com/adamtarantino" target="_blank" rel="noopener">buy me a coffee ☕</a></span>`:''}</div>`;

  html += `<h2>Up next — new problems</h2>`;
  if(gated){
    html += `<div class="gate">
      <strong>New problems paused — ${backlog} reviews are waiting.</strong>
      <div class="gsub">Anki's rule, and it's the right one: adding new material on top of a backlog just grows the backlog. Clear these down to ${NEW_GATE-1} and the queue reopens by itself.</div>
      <button class="iconbtn" data-gate>Add one anyway</button>
    </div>`;
  } else {
    html += `<p class="sub">Mixed across patterns on purpose — interleaved practice beats working a category to completion, because recognising <em>which</em> pattern applies is the skill under test.</p><div class="newlist">`;
    html += newProbs.length ? newProbs.map(p=>probCard(p, pstate(p), {isNew:true})).join('')
      : `<div class="empty">Nothing left in the queue — every problem is either started or skipped.</div>`;
    html += `</div>`;
  }
  return html;
}

function renderAll(){
  const pool = activePool().sort(byOrd);
  const info = TIER_INFO[state.tier];
  const cats = [...new Set(pool.map(p=>p.cat))];
  const q = search.trim().toLowerCase();
  const matchesFilter=(x)=>{
    if(q && !x.p.name.toLowerCase().includes(q)) return false;
    if(allFilter==='leech') return !!leechInfo(x.p.id);
    if(allFilter==='skipped') return isDismissed(x.p.id);
    if(allFilter==='all') return true;
    return allFilter==='new' ? x.s.status==='new' : x.s.status===allFilter;
  };
  let html = `<div class="prefsbar">
    <div class="prefgroup"><span class="preflabel">Study list</span><span class="seg" role="group" aria-label="Study list">
      ${[75,150,250].map(t=>`<button data-tier="${t}" class="${state.tier===t?'on':''}" aria-pressed="${state.tier===t}">${TIER_INFO[t].label}</button>`).join('')}
    </span></div>
    <div class="prefgroup"><span class="preflabel">Solve on</span><span class="seg" role="group" aria-label="Preferred problem site">
      <button data-linkpref="nc" class="${state.linkPref==='nc'?'on':''}" aria-pressed="${state.linkPref==='nc'}">NeetCode</button>
      <button data-linkpref="lc" class="${state.linkPref==='lc'?'on':''}" aria-pressed="${state.linkPref==='lc'}">LeetCode</button>
    </span></div>
  </div>
  <div class="searchrow">
    <input type="search" placeholder="Search ${info.n} problems in ${info.label}…" value="${esc(search)}" id="searchBox">
    <div class="filterchips">
      ${['all','due','new','solid','leech','skipped'].map(f=>`<button class="fchip ${allFilter===f?'on':''}" data-filter="${f}">${f[0].toUpperCase()+f.slice(1)}</button>`).join('')}
    </div></div>`;
  for(const cat of cats){
    let items = pool.filter(p=>p.cat===cat).map(p=>({p, s:pstate(p)}));
    const seen = items.filter(x=>x.s.n>0).length, tot=items.length;
    items = items.filter(matchesFilter);
    if((q||allFilter!=='all') && !items.length) continue;
    const open = openCats.has(cat) || q || allFilter!=='all';
    html += `<div class="cat-block"><div class="cat-head" data-cat="${esc(cat)}">
      <span class="chev">${open?'▼':'▶'}</span><span class="cat-name">${esc(cat)}</span>
      <span class="cat-mini" title="${seen}/${tot} attempted"><i style="width:${Math.round(seen/tot*100)}%"></i></span>
      <span class="cat-count">${seen}/${tot}</span></div>`;
    if(open){
      html += `<table class="plist">` + items.map(x=>{
        const {p,s}=x;
        const skipped = isDismissed(p.id);
        const dueTxt = skipped ? 'skipped' : s.n===0 ? '—' : (s.due<=todayStr() ? 'due now' : nice(s.due));
        return `<tr data-row="${p.id}">
          <td class="c-dot"><span class="dot ${s.status==='due'?(s.last?s.last.r:'video'):s.status}" title="${s.status}"></span></td>
          <td>${esc(p.name)}${leechInfo(p.id)?' <span class="leech-tag">leech</span>':''}${skipped?` <button class="skipbtn" data-unskip="${p.id}" title="Put this back in the queue">un-skip</button>`:''}</td>
          <td class="c-diff"><span class="badge ${p.diff.toLowerCase()}">${p.diff}</span></td>
          <td class="c-n">${s.n||''}</td>
          <td class="c-due">${dueTxt}</td>
        </tr>` + (openForms.has(p.id)?`<tr class="formtr"><td colspan="5">${logFormHTML(p,s)}</td></tr>`:'');
      }).join('') + `</table>`;
    }
    html += `</div>`;
  }
  const outside = PROBLEMS.filter(p=>p.tier>state.tier && attemptsFor(p.id).length>0)
    .sort(byOrd).map(p=>({p,s:pstate(p)})).filter(matchesFilter);
  if(outside.length){
    html += `<div class="outside-block"><h2>Started outside ${info.label} <span class="badge">${outside.length}</span></h2>
      <p class="sub">These keep their review schedule even while a smaller list is active.</p>
      <table class="plist">${outside.map(({p,s})=>{
        const dueTxt=s.due<=todayStr()?'due now':nice(s.due);
        return `<tr data-row="${p.id}">
          <td class="c-dot"><span class="dot ${s.status==='due'?(s.last?s.last.r:'video'):s.status}" title="${s.status}"></span></td>
          <td>${esc(p.name)} <span class="outside-tag">outside ${esc(info.label)}</span></td>
          <td class="c-diff"><span class="badge ${p.diff.toLowerCase()}">${p.diff}</span></td>
          <td class="c-n">${s.n}</td><td class="c-due">${dueTxt}</td>
        </tr>${openForms.has(p.id)?`<tr class="formtr"><td colspan="5">${logFormHTML(p,s)}</td></tr>`:''}`;
      }).join('')}</table></div>`;
  }
  return html;
}

/* ---------- share recap card ----------
   One-tap PNG of your recap: a terminal-receipt frame around the same
   16-week heatmap the Stats tab shows. The card is built as an SVG string
   and rasterized on a canvas, so the export needs no libraries and no
   network — system fonts only. Shares via the Web Share API where file
   sharing exists (iOS/Android), otherwise downloads the PNG. */
const SHARE_URL = 'intervalreps.vercel.app';
const CARD_MONO = `ui-monospace,Menlo,Consolas,monospace`;
/* fixed palette (dark ramp) — the export ignores the viewer's theme */
const CARD_P = {page:'#0d0d0d', win:'#1a1a19', ink:'#ffffff', muted:'#898781',
  grid:'#2c2c2a', good:'#0ca30c', warn:'#fab219', crit:'#d03b3b',
  ramp:['#262624','#0d366b','#104281','#1c5cab','#3987e5']};

function recapData(){
  const t = todayStr();
  const info = TIER_INFO[state.tier];
  const pool = activePool();
  const seen = pool.filter(p=>pstate(p).n>0).length;
  const EMO = {cold:'⚡', hints:'🟨', video:'🟥'};
  const today = state.log.filter(a=>a.d===t && EMO[a.r]);
  const recent = state.log.slice(-20);
  const counts = {}; state.log.forEach(a=>counts[a.d]=(counts[a.d]||0)+1);
  return {
    streak: streak(),
    todayEmo: today.map(a=>EMO[a.r]).join(''),
    todayN: today.length,
    todayCold: today.filter(a=>a.r==='cold').length,
    coldRate: recent.length? Math.round(100*recent.filter(a=>a.r==='cold').length/recent.length) : 0,
    seen, listN: info.n, listLabel: info.label,
    total: state.log.length, counts,
  };
}

function recapCardSVG(d, w, h){
  const P=CARD_P, port=h>w;
  const m=w*0.06, px=w*0.05, tx=m+px;
  const fs=port? w*0.034 : w*0.024, lh=fs*1.9;
  const gap=Math.max(4, Math.round(w*0.006));
  const innerW=(w-2*m)-2*px;
  const cell=Math.floor(((port? innerW : innerW*0.46)-15*gap)/16);
  const gridW=16*cell+15*gap, gridH=7*cell+6*gap;
  const bar=fs*2.6;
  const contentH = port
    ? lh*1.2 + 4*lh + fs*0.4 + gridH + lh*1.2 + fs*0.6
    : Math.max(lh*1.2 + 5*lh, fs*0.8 + gridH) + fs*0.4;
  const winW=w-2*m, winH=bar+fs*1.4+contentH+fs*1.2, winY=(h-winH)/2 - h*0.02;
  let y=winY+bar+fs*1.4, out='';
  const vx=tx+w*(port?0.30:0.14);
  const line=(label,val)=>{ out+=`<text x="${tx}" y="${y}" font-family="${CARD_MONO}" font-size="${fs}" fill="${P.muted}">${label}</text><text x="${vx}" y="${y}" font-family="${CARD_MONO}" font-size="${fs}" fill="${P.ink}">${val}</text>`; y+=lh; };
  out+=`<text x="${tx}" y="${y}" font-family="${CARD_MONO}" font-size="${fs}" fill="${P.good}">$ ncsr --recap</text>`; y+=lh*1.2;
  const fb=Math.round(10*d.seen/d.listN);
  line('streak', `${d.streak} day${d.streak===1?'':'s'} 🔥`);
  line('today', d.todayN? `${d.todayEmo}  ${d.todayCold}/${d.todayN} cold` : '—');
  line('last 20', `${d.coldRate}% cold`);
  line(esc(d.listLabel.toLowerCase()), `${'▓'.repeat(fb)}${'░'.repeat(10-fb)}  ${d.seen}/${d.listN}`);
  if(!port) line('attempts', `${d.total} total`);
  let hx, hy;
  if(port){ y+=fs*0.4; hx=tx; hy=y; y+=gridH+lh*1.2; }
  else { hx=m+winW-px-gridW; hy=winY+bar+fs*0.8; }
  const end=parse(todayStr()), dow=end.getDay();
  const start=new Date(end); start.setDate(start.getDate()-(15*7+dow));
  let i=0;
  for(let dd=new Date(start); dd<=end; dd.setDate(dd.getDate()+1), i++){
    const c=d.counts[fmt(dd)]||0, lv=c===0?0 : c===1?1 : c===2?2 : c<=4?3 : 4;
    out+=`<rect x="${hx+Math.floor(i/7)*(cell+gap)}" y="${hy+(i%7)*(cell+gap)}" width="${cell}" height="${cell}" rx="${Math.max(2,cell*0.18)}" fill="${P.ramp[lv]}"/>`;
  }
  if(port){ out+=`<text x="${tx}" y="${y}" font-family="${CARD_MONO}" font-size="${fs}" fill="${P.muted}">attempts</text><text x="${vx}" y="${y}" font-family="${CARD_MONO}" font-size="${fs}" fill="${P.ink}">${d.total} total</text>`; }
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
  <rect width="${w}" height="${h}" fill="${P.page}"/>
  <rect x="${m}" y="${winY}" width="${winW}" height="${winH}" rx="${w*0.02}" fill="${P.win}" stroke="${P.grid}"/>
  <circle cx="${m+w*0.035}" cy="${winY+fs*1.3}" r="${w*0.009}" fill="${P.crit}"/>
  <circle cx="${m+w*0.062}" cy="${winY+fs*1.3}" r="${w*0.009}" fill="${P.warn}"/>
  <circle cx="${m+w*0.089}" cy="${winY+fs*1.3}" r="${w*0.009}" fill="${P.good}"/>
  <text x="${w/2}" y="${winY+fs*1.55}" text-anchor="middle" font-family="${CARD_MONO}" font-size="${fs*0.8}" fill="${P.muted}">interval — recap</text>
  ${out}
  <text x="${w/2}" y="${h-h*0.05}" text-anchor="middle" font-family="${CARD_MONO}" font-size="${fs*0.9}" fill="${P.muted}">— ${SHARE_URL} —</text>
</svg>`;
}

/* Wordle-style text recap — pastes cleanly anywhere an image can't go */
function recapText(){
  const d = recapData();
  const fb = Math.round(10*d.seen/d.listN);
  return `Interval — day ${d.streak} 🔥
${d.todayN? `${d.todayEmo} ${d.todayCold}/${d.todayN} cold` : '— no reps yet today'}
${d.listLabel} ${'▓'.repeat(fb)}${'░'.repeat(10-fb)} ${d.seen}/${d.listN}`;
}

async function copyRecapText(){
  try{ await navigator.clipboard.writeText(recapText()); toast('Recap copied'); }
  catch(err){ toast('Could not copy — clipboard unavailable'); }
}

async function shareRecapCard(){
  const portrait = matchMedia('(pointer:coarse)').matches || innerWidth<700;
  const [w,h] = portrait? [1080,1350] : [1200,675];
  const svg = recapCardSVG(recapData(), w, h);
  const svgUrl = URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
  try{
    const img = new Image();
    await new Promise((res,rej)=>{ img.onload=res; img.onerror=()=>rej(new Error('svg render')); img.src=svgUrl; });
    const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
    cv.getContext('2d').drawImage(img,0,0,w,h);
    const blob = await new Promise(r=>cv.toBlob(r,'image/png'));
    if(!blob) throw new Error('png encode');
    const file = new File([blob], `ncsr-recap-${todayStr()}.png`, {type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file]}); return; }
      catch(err){ if(err.name==='AbortError') return; /* else fall through to download */ }
    }
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=file.name; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
    toast('Recap image downloaded');
  }catch(err){ toast('Could not create the recap image'); }
  finally{ URL.revokeObjectURL(svgUrl); }
}

function renderStats(){
  const t = todayStr();
  const pool = activePool();
  const info = TIER_INFO[state.tier];
  const states = pool.map(p=>({p, s:pstate(p)}));
  const seen = states.filter(x=>x.s.n>0).length;
  const solid = states.filter(x=>x.s.n>0 && x.s.interval>=30).length;
  const due = allDue().length;
  const leeches = leechList().length;
  const skipped = pool.filter(p=>isDismissed(p.id)).length;
  const recall = trackKatas('recall');
  const drills = trackKatas('drills');
  const mins = state.log.filter(a=>a.m).map(a=>a.m).sort((a,b)=>a-b);
  const med = mins.length? mins[Math.floor(mins.length/2)] : 0;
  const coldRate = (()=>{ const recent=state.log.slice(-20); if(!recent.length)return 0; return Math.round(100*recent.filter(a=>a.r==='cold').length/recent.length); })();
  let html = `<div class="sharebar"><button data-copyrecap>Copy recap</button><button data-sharecard>Share recap ↗</button></div>
  <div class="tiles">
    <div class="tile"><div class="tv">${seen}<small> /${info.n}</small></div><div class="tl">${esc(info.label)} attempted</div></div>
    <div class="tile"><div class="tv">${solid}</div><div class="tl">solid in ${esc(info.label)} (≥30d)</div></div>
    <div class="tile"><div class="tv">${due}</div><div class="tl">due today across started problems</div></div>
    <div class="tile"><div class="tv">${streak()}<small> d</small></div><div class="tl">current streak</div></div>
    <div class="tile"><div class="tv">${state.log.length}</div><div class="tl">total attempts</div></div>
    <div class="tile"><div class="tv">${coldRate}<small>%</small></div><div class="tl">solved cold, last 20</div></div>
    <div class="tile"><div class="tv">${leeches}</div><div class="tl">leeches (2 of last 3 needed help)</div></div>
    <div class="tile"><div class="tv">${skipped}</div><div class="tl">skipped</div></div>
    <div class="tile"><div class="tv">${recall.filter(k=>!isDraft(k)).length}</div><div class="tl">Recall cards in rotation</div></div>
    <div class="tile"><div class="tv">${recall.filter(isDraft).length}</div><div class="tl">Recall captures, need answers</div></div>
    <div class="tile"><div class="tv">${drills.length}</div><div class="tl">Katas in rotation</div></div>
  </div>`;

  html += `<h2>Progress across lists</h2><div class="tier-progress">`;
  for(const tier of [75,150,250]){
    const tierPool=activePool(tier);
    const sn=tierPool.filter(p=>attemptsFor(p.id).length>0).length;
    html += `<div class="brow"><span class="bl">${TIER_INFO[tier].label}</span>
      <span class="btrack" role="img" aria-label="${TIER_INFO[tier].label}: ${sn} of ${tierPool.length} attempted">
        <span class="bfill" style="width:${sn/tierPool.length*100}%"></span>
      </span><span class="bv">${sn}/${tierPool.length}</span></div>`;
  }
  html += `</div>`;

  html += `<h2>Progress by pattern</h2>
  <div class="legend">
    <span class="li"><span class="sw" style="background:var(--seq-650)"></span>solid (≥30d interval)</span>
    <span class="li"><span class="sw" style="background:var(--seq-350)"></span>attempted</span>
    <span class="li"><span class="sw" style="background:var(--chip-bg);border:1px solid var(--grid)"></span>not started</span>
  </div><div class="bars">`;
  for(const cat of [...new Set(pool.map(p=>p.cat))]){
    const items = states.filter(x=>x.p.cat===cat);
    const tot=items.length, sn=items.filter(x=>x.s.n>0).length, sl=items.filter(x=>x.s.n>0&&x.s.interval>=30).length;
    html += `<div class="brow"><span class="bl">${esc(cat)}</span>
      <span class="btrack" role="img" aria-label="${cat}: ${sn} of ${tot} attempted, ${sl} solid">
        <span class="bfill" style="width:${sn/tot*100}%"></span>
        <span class="bfill solidpart" style="width:${sl/tot*100}%"></span>
      </span><span class="bv">${sn}/${tot}</span></div>`;
  }
  html += `</div>`;

  // 16-week heatmap
  const counts = {}; state.log.forEach(a=>counts[a.d]=(counts[a.d]||0)+1);
  const end = parse(t); const dow = end.getDay();
  const start = new Date(end); start.setDate(start.getDate() - (15*7 + dow));
  const ramp = ['var(--chip-bg)','var(--seq-100)','var(--seq-200)','var(--seq-350)','var(--seq-500)'];
  let cells='';
  for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
    const ds=fmt(d), c=counts[ds]||0;
    const lvl = c===0?0 : c===1?1 : c===2?2 : c<=4?3 : 4;
    cells += `<span class="hcell" style="background:${ramp[lvl]}" title="${ds}: ${c} attempt${c===1?'':'s'}"></span>`;
  }
  html += `<h2>Activity — last 16 weeks</h2><div class="heat">${cells}</div>
  <div class="heat-legend">0 ${ramp.map(r=>`<span class="hcell" style="background:${r}"></span>`).join('')} 5+</div>`;
  return html;
}

function renderAbout(){
  const info=TIER_INFO[state.tier];
  const listUrl=`https://neetcode.io/practice/practice/${info.list}`;
  return `<div class="prose">
  <h3>What this is</h3>
  <p>A trainer for the <a href="${listUrl}" target="_blank" rel="noopener">${info.label}</a> that schedules when you should <em>re-solve</em> each problem, using the two most robust findings in learning science: the <strong>spacing effect</strong> and the <strong>testing effect</strong>.</p>
  <p><strong>About the lists.</strong> Problem names, categories and links follow the lists curated by
    <a href="https://neetcode.io/" target="_blank" rel="noopener">NeetCode / Navdeep Singh</a>.
    This independent trainer stores only that metadata and your own logs—never problem statements or solutions.
    NeetCode's videos, courses and <a href="https://neetcode.io/pro" target="_blank" rel="noopener">Pro membership</a> support the original work.
    This app is not affiliated with NeetCode or LeetCode.</p>
  <h3>The research, briefly</h3>
  <p><strong>Spacing beats cramming.</strong> Cepeda, Pashler &amp; colleagues' meta-analysis of 254 comparisons found distributed practice reliably outperforms massed practice, and that the optimal gap between reviews <em>grows</em> with how long you want to remember something. Re-solving a problem days or weeks later — right around when you'd start to forget — is what makes the memory durable.</p>
  <p><strong>Retrieval is the workout.</strong> Roediger &amp; Karpicke showed that <em>testing yourself</em> produces far better long-term retention than re-reading or re-watching. That's why this app asks you to re-solve from a blank editor, and hides your old notes behind a click — recalling the approach yourself is the rep. Watching the solution video again is the weakest form of practice, so it schedules the tightest redo.</p>
  <p><strong>Difficulty is desirable.</strong> Bjork's "desirable difficulties" work shows that effortful, slightly-uncomfortable practice feels worse but sticks better. Struggling for 20 minutes before cracking it is a feature.</p>
  <p><strong>Interleaving helps discrimination.</strong> Mixing patterns (Rohrer's interleaving studies) trains the skill interviews actually test — recognizing <em>which</em> pattern applies. Your review queue naturally interleaves old patterns while you push into new categories.</p>
  <h3>How scheduling works (SM-2, adapted)</h3>
  <p>Each problem carries an <em>ease factor</em> (starts at 2.5) and an <em>interval</em>. Your result sets the next review:</p>
  <table class="sched-table">
    <tr><th>Result</th><th>Next review</th><th>Ease</th></tr>
    <tr><td>⚡ Solved cold</td><td>first time: 7 days; after that: interval × ease (7 → ~17 → ~40 → ~100d, capped at 120)</td><td>+0.05</td></tr>
    <tr><td>💡 Needed hints</td><td>2 days</td><td>−0.15</td></tr>
    <tr><td>▶ Watched video</td><td>tomorrow</td><td>−0.20</td></tr>
  </table>
  <p>Problems you find hard develop a low ease factor and come back more often; ones you own graduate to month-plus intervals. A problem is <strong>solid</strong> once its interval reaches 30 days. This evolves the sheet rule you were using (next-day for hints/video, +7 for cold) into expanding intervals, so the review load doesn't pile up linearly as you work through the full list.</p>
  <h3>Four rules the queue enforces for you</h3>
  <p><strong>1. New problems pause when the backlog hits ${NEW_GATE}.</strong> This is Anki's own guidance for an overdue pile: stop introducing new material until you've caught up, because new cards on top of a backlog compound it. The queue reopens on its own once you're back under the line.</p>
  <p><strong>2. New problems arrive interleaved, not in NeetCode order.</strong> Rohrer, Dedrick, Hartwig &amp; Cheung ran a randomised controlled trial across 54 classrooms: interleaved practice beat blocked practice with an effect size of d ≈ 0.83. The mechanism is the point — when problems come blocked by pattern, you know the strategy before you've read the question. An interview never does that. So once you have ${INTERLEAVE_AFTER}+ patterns in play, no two consecutive new problems come from the same one.</p>
  <p><strong>3. The first problem in a new pattern says "watch the video".</strong> Cognitive load theory's worked-example effect: for genuine novices, studying a solution beats struggling toward one. The effect reverses with expertise, which is why it only applies to your first contact with a pattern — everywhere else, struggle is the point.</p>
  <p><strong>4. Repeated failures become leeches.</strong> Anki tags a card a leech when it keeps lapsing, and the fix is never "try harder" — it's to change how the thing is encoded. Here, 2 non-cold results in your last 3 attempts pulls a problem out of the normal queue and asks you to re-derive the insight in a sentence before you touch the keyboard. Two clean solves clears it.</p>
  <h3>Transfer tests</h3>
  <p>Once you've solved a problem cold twice, re-solving it mostly measures whether you remember <em>that problem</em>. So the card offers you an unseen sibling from the same pattern instead. Solving that cold is strictly stronger evidence than another rep on the one you've memorised, so it advances both cards' schedules. This is the closest thing the app has to a real interview: same pattern, no warning, blank editor.</p>
  <h3>Three learning objects, three tempos</h3>
  <p>A problem is a 30-minute problem-solving episode. A recall fact — “counter map over a <code>string[]</code>” — is a five-second production. A kata is a 10-minute implementation form. Treating those as one queue made the schedule lie about the cost of a rep, so each now has its own track and spacing.</p>
  <h3>Recall — an Anki deck for code</h3>
  <p><strong>Five-second facts get the long memory curve.</strong> Recall starts at a 2-day interval and can stretch to a full year. JavaScript, TypeScript and SQL cards can run in the browser; assertions make correctness objective, while concept cards still demand that you say the answer before revealing it.</p>
  <p><strong>You type the answer, you don't flip a card.</strong>
    <a href="https://doi.org/10.3758/s13421-012-0245-x" target="_blank" rel="noopener">Putnam &amp; Roediger's work on overt retrieval</a>
    is the reason: actually producing an answer beats thinking “yeah, I know this.” That gap is exactly the failure mode of AI-assisted fluency — reading a solution feels like knowing it.</p>
  <p><strong>Capture beats curation.</strong> Recall starts empty and fills from friction. Every problem log has one field for whatever you had to look up; the capture waits outside the queue until you write its answer. One field in the moment, authoring later.</p>
  <p><strong>A Recall leech is usually a malformed card.</strong>
    <a href="https://super-memory.com/articles/20rules.htm" target="_blank" rel="noopener">Wozniak's minimum information principle</a>
    says the fix is to split a prompt that asks two things at once, not to grind the same overloaded card harder.</p>
  <h3>Katas — implementation forms</h3>
  <p><strong>Kata 型</strong> means a martial-arts form repeated until the movements stop being decisions; Dave Thomas borrowed the idea into programming with code katas in 2003. Here, each kata is a 10–20 minute data-structure implementation performed from memory.</p>
  <p><strong>The lineage runs through kata-machine.</strong> The 23 forms are inspired by
    <a href="https://github.com/ThePrimeagen/kata-machine" target="_blank" rel="noopener">ThePrimeagen's kata-machine</a>
    and scheduled here, but executed in your own clone of <a href="https://github.com/atarantino/kata-typescript" target="_blank" rel="noopener">kata-typescript</a> with a real editor and test runner. No kata-machine code or tests are bundled in this app. Rather than regenerating all 23 daily as massed practice, <code>npm run due</code> reads your sync key and scaffolds exactly what's decaying.</p>
  <p><strong>Weekly until boring, then monthly.</strong> A successful interval has a 7-day floor and a 180-day cap; “Had to think” returns in at least 3 days and a blank in 2. Grade hesitation, not wall-clock time: “Instant” means you typed the form without stopping to decide what comes next.</p>
  <p><strong>A kata leech means the form hasn't encoded.</strong> Splitting does not apply to a form. Re-derive the algorithm on paper or reread the reference implementation, then come back for another full implementation instead of burning another doomed rep.</p>
  <h3>A sane daily loop</h3>
  <p>Leeches first (they're cheap — you're recalling an idea, not grinding code), then the review queue, then whatever new problems the gate lets through. Cap sessions at ~1 hour. Give a new problem 30–45 minutes before escalating, and escalate through hints rather than jumping to the solution — then re-solve it the next day, which is what turns recognising a solution into being able to generate one.</p>
  <div class="refs">
    Cepeda, Pashler, Vul, Wixted &amp; Rohrer (2006), <a href="https://doi.org/10.1037/0033-2909.132.3.354" target="_blank" rel="noopener"><em>Distributed practice in verbal recall tasks</em></a>, Psych. Bulletin ·
    Cepeda et al. (2008), <a href="https://doi.org/10.1111/j.1467-9280.2008.02209.x" target="_blank" rel="noopener"><em>Spacing effects in learning: a temporal ridgeline of optimal retention</em></a>, Psych. Science ·
    Roediger &amp; Karpicke (2006), <a href="https://doi.org/10.1111/j.1467-9280.2006.01693.x" target="_blank" rel="noopener"><em>Test-enhanced learning</em></a>, Psych. Science ·
    Bjork &amp; Bjork (2011), <a href="https://bjorklab.psych.ucla.edu/wp-content/uploads/sites/13/2016/04/EBjork_RBjork_2011.pdf" target="_blank" rel="noopener"><em>Making things hard on yourself, but in a good way</em></a> ·
    Rohrer &amp; Taylor (2007), <a href="https://doi.org/10.1007/s11251-007-9015-8" target="_blank" rel="noopener"><em>The shuffling of mathematics problems improves learning</em></a> ·
    Rohrer, Dedrick, Hartwig &amp; Cheung (2020), <a href="https://doi.org/10.1037/edu0000367" target="_blank" rel="noopener"><em>A randomized controlled trial of interleaved mathematics practice</em></a>, J. Educational Psychology ·
    Wozniak, <a href="https://super-memory.com/articles/20rules.htm" target="_blank" rel="noopener"><em>Twenty rules of formulating knowledge</em></a> (minimum information principle) ·
    Overt vs. covert retrieval: Putnam &amp; Roediger (2013), <a href="https://doi.org/10.3758/s13421-012-0245-x" target="_blank" rel="noopener"><em>Does response mode affect amount recalled or the magnitude of the testing effect?</em></a>, Memory &amp; Cognition ·
    Sweller, van Merriënboer &amp; Paas (1998), <a href="https://doi.org/10.1023/A:1022193728205" target="_blank" rel="noopener"><em>Cognitive architecture and instructional design</em></a> — worked-example effect &amp; expertise reversal ·
    SM-2: <a href="https://super-memory.com/english/ol/sm2.htm" target="_blank" rel="noopener">Wozniak (1990), SuperMemo</a> · leech handling and backlog policy after the <a href="https://docs.ankiweb.net/leeches.html" target="_blank" rel="noopener">Anki manual</a>.
  </div></div>`;
}

function paintBrand(){
  const info=TIER_INFO[state.tier];
  document.getElementById('listLogo').textContent=info.label;
  document.title=`Interval · ${info.label}`;
  document.getElementById('metaDescription').content=
    `Interval — a spaced-repetition trainer for the ${info.label}, built on spacing-effect and retrieval-practice research.`;
}
function render(){
  paintBrand();
  const backlog = allDue().length;
  document.getElementById('dueCnt').textContent = backlog;
  document.getElementById('dueCnt').className = 'cnt' + (backlog? ' hot':'');
  document.getElementById('streakVal').textContent = streak();
  const recallDue = kataDue('recall').length, drillDue = kataDue('drills').length;
  document.getElementById('recallCnt').textContent = recallDue;
  document.getElementById('recallCnt').className = 'cnt' + (recallDue? ' hot':'');
  document.getElementById('drillCnt').textContent = drillDue;
  document.getElementById('drillCnt').className = 'cnt' + (drillDue? ' hot':'');
  disposeKataEditors();
  view.innerHTML = activeTab==='today'?renderToday(): activeTab==='recall'?renderRecall(): activeTab==='drills'?renderDrills():
    activeTab==='all'?renderAll(): activeTab==='stats'?renderStats(): renderAbout();
  enhanceKataEditors();
  if(activeTab==='all'){
    const sb=document.getElementById('searchBox');
    sb.addEventListener('input', e=>{ search=e.target.value; const pos=e.target.selectionStart; render(); const nb=document.getElementById('searchBox'); nb.focus(); nb.setSelectionRange(pos,pos); });
  }
}

/* ---------- events ---------- */
document.getElementById('tabs').addEventListener('click', e=>{
  const b=e.target.closest('button[data-tab]'); if(!b) return;
  activeTab=b.dataset.tab;
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x===b));
  render();
});
view.addEventListener('click', e=>{
  const del = e.target.closest('[data-del]');
  if(del){
    /* The tombstone is the entry's own key, so deleting an id-bearing attempt can
       no longer suppress a later one that merely shares problem/date/result. */
    const key=del.dataset.del;
    const i = state.log.findIndex(a=>lkey(a)===key);
    if(i>=0){ state.log.splice(i,1); state.deletedLog.push(key); save(); toast('Attempt deleted'); render(); }
    return;
  }
  if(e.target.closest('[data-sharecard]')){ shareRecapCard(); return; }
  if(e.target.closest('[data-copyrecap]')){ copyRecapText(); return; }
  /* ---- recall + katas ---- */
  if(e.target.closest('[data-knew]')){ kataAdding=true; kataEditing=null; render(); return; }
  if(e.target.closest('[data-kseed]')){
    const n = seedDSA();
    toast(n ? `Added ${n} DSA drills — they schedule here, you solve them in kata-typescript` : 'DSA set already seeded');
    render(); return;
  }
  if(e.target.closest('[data-kcancel]')){ kataAdding=false; kataEditing=null; render(); return; }
  const kedit = e.target.closest('[data-kedit]');
  if(kedit){ kataEditing=Number(kedit.dataset.kedit); kataAdding=false;
    activeTab=isDrill(kataById(kataEditing))?'drills':'recall';
    document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active', x.dataset.tab===activeTab));
    render(); return; }
  if(e.target.closest('[data-ksubmit]')){
    const f = e.target.closest('[data-kform]');
    const q = f.querySelector('[data-kq]').value.trim();
    if(!q){ toast('Give it a prompt first'); return; }
    const fields = {q, a:f.querySelector('[data-ka]').value, lang:f.querySelector('[data-klang]').value,
      kind:f.querySelector('[data-kkind]').value, starter:f.querySelector('[data-kstarter]').value,
      test:f.querySelector('[data-ktest]').value, setup:f.querySelector('[data-ksetup]').value};
    if(kataEditing){ Object.assign(kataById(kataEditing), fields, {u: Date.now()}); toast(fields.kind==='repo'?'Kata updated':'Recall updated'); }
    else { state.katas.push({id: genId(), ...fields, u: Date.now(), src:null, created: todayStr()}); toast('Recall added'); }
    kataAdding=false; kataEditing=null; save(); render(); return;
  }
  const kdel = e.target.closest('[data-kdel]');
  if(kdel){
    const kid=Number(kdel.dataset.kdel);
    const deleted = kataById(kid);
    state.katas = state.katas.filter(k=>k.id!==kid);
    state.klog = state.klog.filter(a=>a.kid!==kid);
    state.kataTombs.push(kid);
    save(); toast(isDrill(deleted)?'Kata deleted':'Recall deleted'); render(); return;
  }
  const kres = e.target.closest('[data-kres]');
  if(kres){
    const [kid,r] = kres.dataset.kres.split('|'); const id=Number(kid);
    state.klog.push({i:attemptId(), kid:id, d:todayStr(), r});
    kataOpen.delete(id); kataRevealed.delete(id); kataDraft.delete(id); kataOut.delete(id); kataRuns.delete(id);
    save();
    const s = kstate(kataById(id));
    toast(`${KRLABEL[r]} — back ${s.interval===1?'tomorrow':'in '+s.interval+' days'}`);
    render(); return;
  }
  const krev = e.target.closest('[data-kreveal]');
  if(krev){ const id=Number(krev.dataset.kreveal); kataRevealed.has(id)?kataRevealed.delete(id):kataRevealed.add(id); render(); return; }
  const krun = e.target.closest('[data-krun]');
  if(krun){ runKataFromUI(Number(krun.dataset.krun)); return; }
  const ktog = e.target.closest('[data-ktoggle]');
  if(ktog){
    if(e.target.closest('a')) return;
    const id=Number(ktog.dataset.ktoggle);
    kataOpen.has(id)?kataOpen.delete(id):kataOpen.add(id);
    render(); return;
  }
  const tierBtn=e.target.closest('[data-tier]');
  if(tierBtn){
    const tier=Number(tierBtn.dataset.tier);
    if(TIER_INFO[tier] && tier!==state.tier){
      state.tier=tier; touchPref('tier');
      pendingTransfer.clear(); openTransfers.clear(); openForms.clear(); gateOverride=false;
      save(); render();
    }
    return;
  }
  const linkBtn=e.target.closest('[data-linkpref]');
  if(linkBtn){
    const pref=linkBtn.dataset.linkpref;
    if((pref==='nc'||pref==='lc') && pref!==state.linkPref){
      state.linkPref=pref; touchPref('linkPref'); save(); render();
    }
    return;
  }
  const skip = e.target.closest('[data-skip]');
  if(skip){
    const pid = Number(skip.dataset.skip);
    state.dismissed.push(pid); state.dismissed=[...new Set(state.dismissed)].sort((a,b)=>a-b);
    touchPref('dismissed'); save();
    openForms.delete(pid);
    toast(`Skipped ${PROBLEMS.find(p=>p.id===pid).name} — un-skip it from All problems`);
    render(); return;
  }
  const unskip = e.target.closest('[data-unskip]');
  if(unskip){
    const pid = Number(unskip.dataset.unskip);
    state.dismissed = state.dismissed.filter(x=>x!==pid); touchPref('dismissed'); save();
    toast('Back in the queue'); render(); return;
  }
  if(e.target.closest('[data-gate]')){ gateOverride=true; render(); return; }
  const xopen = e.target.closest('[data-xopen]');
  if(xopen){
    const [orig, sib] = xopen.dataset.xopen.split('|').map(Number);
    if(openTransfers.has(orig)){ openTransfers.delete(orig); pendingTransfer.delete(sib); openForms.delete(sib); }
    else { openTransfers.add(orig); pendingTransfer.set(sib, orig); openForms.add(sib); }
    render(); return;
  }
  const head = e.target.closest('[data-toggle]');
  const row = e.target.closest('tr[data-row]');
  if(head || row){
    if(e.target.closest('a')) return;
    const pid = Number(head?head.dataset.toggle:row.dataset.row);
    openForms.has(pid) ? openForms.delete(pid) : openForms.add(pid);
    render(); return;
  }
  const cat = e.target.closest('.cat-head');
  if(cat){ const c=cat.dataset.cat; openCats.has(c)?openCats.delete(c):openCats.add(c); render(); return; }
  const fchip = e.target.closest('[data-filter]');
  if(fchip){ allFilter=fchip.dataset.filter; render(); return; }
  const rbtn = e.target.closest('.rbtn');
  if(rbtn){
    const form = rbtn.closest('[data-form]');
    form.querySelectorAll('.rbtn').forEach(b=>b.classList.toggle('selected',b===rbtn));
    form.querySelector('[data-save]').disabled=false;
    return;
  }
  const saveBtn = e.target.closest('[data-save]');
  if(saveBtn){
    const form = saveBtn.closest('[data-form]');
    const pid = Number(form.dataset.form);
    const sel = form.querySelector('.rbtn.selected'); if(!sel) return;
    const r = sel.dataset.res;
    const m = Number(form.querySelector('[data-mins]').value)||null;
    const n = form.querySelector('[data-notes]').value.trim();
    state.log.push({i:attemptId(), pid, d:todayStr(), r, m, n});

    // Transfer rep: solving an unseen sibling cold also advances the problem it stood in for.
    const xfer = form.querySelector('[data-xfer]');
    const originPid = pendingTransfer.get(pid);
    let xferName = null;
    if(xfer && xfer.checked && originPid){
      const origin = PROBLEMS.find(q=>q.id===originPid);
      state.log.push({i:attemptId(), pid:originPid, d:todayStr(), r, m:null, n:`Transfer rep — ${RLABEL[r].toLowerCase()} on ${PROBLEMS.find(q=>q.id===pid).name}`});
      pendingTransfer.delete(pid); openTransfers.delete(originPid);
      xferName = origin.name;
    }
    // Capture friction is the whole game — one field, in the flow you're already in.
    const cap = form.querySelector('[data-cap]');
    let capName = null;
    if(cap && cap.value.trim()){
      state.katas.push({id: genId(), q: cap.value.trim(), a:'', lang: form.querySelector('[data-caplang]').value,
        kind:'code', test:'', setup:'', starter:'', u: Date.now(), src: pid, created: todayStr()});
      capName = cap.value.trim();
    }
    save();
    openForms.delete(pid);
    const s = pstate(PROBLEMS.find(p=>p.id===pid));
    toast(`Logged ${RLABEL[r].toLowerCase()} — back ${s.interval===1?'tomorrow':'in '+s.interval+' days'} (${nice(s.due)})${xferName?` · credited ${xferName}`:''}${capName?` · added “${capName}” to Recall`:''}`);
    render(); return;
  }
});
/* ---- recall editor: keep drafts across re-renders, run without losing focus ---- */
view.addEventListener('input', e=>{
  const ed = e.target.closest('[data-keditor]');
  if(ed) kataDraft.set(Number(ed.dataset.keditor), ed.value);
});
view.addEventListener('keydown', e=>{
  const ed = e.target.closest('[data-keditor]');
  if(!ed) return;
  if(e.key==='Tab'){
    e.preventDefault();
    const s=ed.selectionStart, en=ed.selectionEnd;
    ed.value = ed.value.slice(0,s) + '  ' + ed.value.slice(en);
    ed.selectionStart = ed.selectionEnd = s+2;
    kataDraft.set(Number(ed.dataset.keditor), ed.value);
  } else if(e.key==='Enter' && (e.metaKey||e.ctrlKey)){
    e.preventDefault();
    runKataFromUI(Number(ed.dataset.keditor));
  }
});
async function runKataFromUI(kid){
  const k = kataById(kid); if(!k) return;
  const med = monacoEds.get(kid);
  const ed = view.querySelector(`[data-keditor="${kid}"]`);
  const code = med ? med.getValue() : ed ? ed.value : (kataDraft.get(kid)||'');
  const slot = view.querySelector(`[data-kout="${kid}"]`);
  if(slot) slot.innerHTML = `<div class="out">Running…</div>`;
  kataRuns.set(kid, (kataRuns.get(kid)||0)+1);
  let res;
  try{ res = await runKata(k, code); }
  catch(err){ res = {ok:false, error:(err&&err.message)||String(err)}; }
  kataOut.set(kid, res);
  const slot2 = view.querySelector(`[data-kout="${kid}"]`);
  if(slot2) slot2.innerHTML = renderOut(res);
  // A passing assertion is objective evidence, so pre-select the grade rather than
  // making you rate yourself after seeing it work.
  if(res.ok && k.test){
    const want = (kataRuns.get(kid)||1) <= 1 ? 'instant' : 'slow';
    view.querySelectorAll(`[data-kres^="${kid}|"]`).forEach(b=>b.classList.toggle('selected', b.dataset.kres===`${kid}|${want}`));
  }
}

/* ---- sync UI ----
   Signing in and the pairing link are not two competing features: both turn sync on,
   and both are just ways of getting the same 128-bit key onto a second device. The
   panel says so — sign-in is the recommended door because the key is recoverable
   behind it, the link is the no-account door with the loss risk stated plainly. */
const syncbar = document.getElementById('syncbar');
let pairLinkShown = false;
let rotateArmed = false;
function pairLink(){
  const key = syncKey();
  return location.origin.startsWith('http')
    ? `${location.origin}${location.pathname}#k=${key}`
    : `https://intervalreps.vercel.app/#k=${key}`;
}
function maskLink(link){ return link.replace(/#k=.*$/, '#k=' + '•'.repeat(20)); }
// The link is a bearer capability, so it stays masked until you ask for it — a
// screenshot or a shoulder glance shouldn't be enough to hand over the log.
function syncHeadHTML(){
  if(!syncKey()){
    return `<span class="sync-dot"></span><strong>Sync is off</strong>
      <span class="sync-stamp">— this log lives only in this browser</span>`;
  }
  if(syncState==='revoked'){
    return `<span class="sync-dot error"></span><strong>Sync disconnected</strong>
      <span class="sync-stamp">— this device's link was rotated</span>`;
  }
  const dot = syncState==='ok' ? 'on' : syncState==='dirty' ? 'pending' : syncState==='error' ? 'error' : '';
  const stamp =
    syncState==='ok' ? (syncStamp ? `— last synced ${syncStamp.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}` : '') :
    syncState==='dirty' ? '— saving changes…' :
    syncState==='error' ? '— last attempt failed, retrying on your next change' : '';
  return `<span class="sync-dot ${dot}"></span><strong>Sync is on</strong>
    <span class="sync-stamp">${stamp}</span>
    <span class="spacer"></span><button class="iconbtn" data-syncnow>Sync now</button>`;
}
function paintSyncbar(){
  if(syncbar.style.display==='none') return;
  const key = syncKey();
  const showGoogle = googleConfigured();
  const email = googleEmail();
  const head = `<div class="sync-head" id="syncHead">${syncHeadHTML()}</div>`;
  if(!key){
    syncbar.innerHTML = head + (showGoogle
      ? `<div class="sync-sec">
           <div class="sync-label">Recommended</div>
           <div data-google-signin="primary"></div>
           <p class="sync-note">Turns sync on and ties this log to your Google account. Sign in on another computer — or on this one after clearing your browser — and the log comes back. Nothing to keep track of.</p>
         </div>
         <div class="sync-sec">
           <div class="sync-label">Without an account</div>
           <button class="ghost" data-syncon>Use a pairing link instead</button>
           <p class="sync-note">You get one secret link to open on your other devices. Anyone holding it has your log, and if you lose it there's no way back in.</p>
         </div>`
      : `<div class="sync-sec">
           <button class="primary" data-syncon>Turn on sync</button>
           <p class="sync-note">You get one secret link to open on your other devices, and the merged log is stored against it. Anyone holding the link has your log, and if you lose it there's no way back in.</p>
         </div>`);
  } else if(syncState==='revoked'){
    // The link in localStorage is dead, so showing it — or any action that implies
    // it still works — would be a lie. Offer only the two real ways back.
    syncbar.innerHTML = head + `
      <div class="sync-sec">
        <div class="sync-label">Reconnect</div>
        ${showGoogle
          ? `<div data-google-signin="primary"></div>
             <p class="sync-note">Signing in picks up the current link for your account and pushes this device's log into it.</p>`
          : `<p class="sync-note">Open the current pairing link on this device to reconnect.</p>`}
        <p class="sync-note">Or open the new pairing link here, from a device that already has it.</p>
      </div>
      <div class="sync-foot">
        <button class="ghost" data-syncoff>Turn off sync on this device</button>
        <span class="sync-note">Nothing logged in this browser has been lost — it is still here, just not syncing.</span>
      </div>`;
  } else {
    const link = pairLink();
    syncbar.innerHTML = head + `
      ${showGoogle ? (email
        ? `<div class="sync-sec">
             <div class="sync-label">Account</div>
             <div class="sync-line"><span class="who">${esc(email)}</span><button class="ghost" data-google-signout>Sign out here</button></div>
             <p class="sync-note">Sign in with this account on any other device to pick up the same log — no link needed.</p>
           </div>`
        : `<div class="sync-sec">
             <div class="sync-label">Account</div>
             <div data-google-signin="secondary"></div>
             <p class="sync-note">The link below is currently the only way back into this log. Sign in and your Google account can recover it instead.</p>
           </div>`) : ''}
      <div class="sync-sec">
        <div class="sync-label">Pairing link</div>
        <div class="srow">
          <input type="text" readonly id="pairLink" aria-label="Pairing link"
                 data-link="${esc(link)}" value="${esc(pairLinkShown ? link : maskLink(link))}">
          <button class="iconbtn" data-syncreveal>${pairLinkShown?'Hide':'Show'}</button>
          <button class="iconbtn" data-synccopy>Copy</button>
        </div>
        <p class="sync-note">Open it once on another device and the two logs merge: attempts union, deletions stick, newest deck edit wins. Treat it like a password.</p>
        ${rotateArmed
          ? `<div class="sync-confirm">
               <p class="sync-note"><strong>Rotate this link?</strong> The current one stops working everywhere, immediately. ${email
                 ? 'Your other devices reconnect on their own the next time you sign in on them.'
                 : 'Every other device stops syncing until you open the new link on it.'}</p>
               <p class="sync-note">Your log is carried across untouched. This blocks future access with the old link; it can't undo access someone already had.</p>
               <div class="srow">
                 <button class="primary" data-rotate-go>Rotate link</button>
                 <button class="ghost" data-rotate-cancel>Cancel</button>
               </div>
             </div>`
          : `<button class="ghost" data-rotate>Rotate this link</button>`}
      </div>
      <div class="sync-foot">
        <button class="ghost" data-syncoff>Turn off sync on this device</button>
        <span class="sync-note">${email?'Signs you out here too. ':''}Everything already logged in this browser stays.</span>
      </div>
      <span class="kofi-nudge">Sync runs on a small backend I pay for out of pocket — if it earns its keep, <a href="https://ko-fi.com/adamtarantino" target="_blank" rel="noopener">buy me a coffee ☕</a></span>`;
  }
  renderGoogleSignInButton();
}
document.getElementById('syncBtn').addEventListener('click', e=>{
  const open = syncbar.style.display==='none';
  syncbar.style.display = open ? '' : 'none';
  e.currentTarget.setAttribute('aria-expanded', String(open));
  pairLinkShown = false;
  rotateArmed = false;
  paintSyncbar();
});
syncbar.addEventListener('click', e=>{
  if(e.target.closest('[data-syncon]')){
    // A fresh random key is nobody's account key, so any stale sign-in has to go with it.
    localStorage.removeItem(GOOGLE_EMAIL_LS);
    localStorage.setItem(SYNC_KEY_LS, newSyncKey());
    pairLinkShown = false; rotateArmed = false; syncState='off';
    paintSyncbar(); syncNow(); toast('Sync on — copy the link and open it on your other device');
  } else if(e.target.closest('[data-syncreveal]')){
    const inp=document.getElementById('pairLink'), btn=e.target.closest('[data-syncreveal]');
    pairLinkShown = !pairLinkShown;
    inp.value = pairLinkShown ? inp.dataset.link : maskLink(inp.dataset.link);
    btn.textContent = pairLinkShown ? 'Hide' : 'Show';
  } else if(e.target.closest('[data-synccopy]')){
    // Copy the real link even while it's masked on screen.
    const inp=document.getElementById('pairLink'), real=inp.dataset.link;
    const fallback=()=>{
      inp.value = real; inp.select(); document.execCommand('copy');
      if(!pairLinkShown) inp.value = maskLink(real);
      toast('Pairing link copied');
    };
    if(navigator.clipboard) navigator.clipboard.writeText(real).then(()=>toast('Pairing link copied'), fallback);
    else fallback();
  } else if(e.target.closest('[data-rotate]')){
    rotateArmed = true; paintSyncbar();
  } else if(e.target.closest('[data-rotate-cancel]')){
    rotateArmed = false; paintSyncbar();
  } else if(e.target.closest('[data-rotate-go]')){
    rotateArmed = false; rotateSyncKey();
  } else if(e.target.closest('[data-syncnow]')){
    syncNow(); toast('Syncing…');
  } else if(e.target.closest('[data-syncoff]')){
    // Staying "signed in" with sync off would be a state with no meaning — the account
    // exists only to hand back a sync key — so the one switch turns off both.
    const wasSignedIn = !!googleEmail();
    localStorage.removeItem(SYNC_KEY_LS); syncState='off'; pairLinkShown=false; rotateArmed=false;
    if(wasSignedIn) signOutGoogle();
    paintSync(); paintSyncbar();
    toast(wasSignedIn ? 'Sync off and signed out — your log stays in this browser'
                      : 'Sync off — your log stays in this browser');
  } else if(e.target.closest('[data-google-signout]')){
    signOutGoogle();
  }
});

/* export / import / theme */
document.getElementById('exportBtn').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`interval-${todayStr()}.json`; a.click();
});
document.getElementById('importBtn').addEventListener('click', ()=>document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{ const d=JSON.parse(rd.result); if(!Array.isArray(d.log)) throw 0; state=migrate(d); save(); toast('Log imported'); render(); }catch(_){ toast('Not a valid backup file'); } };
  rd.readAsText(f);
});
document.getElementById('themeBtn').addEventListener('click', ()=>{
  const cur = localStorage.getItem('ncsr-theme') || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const next = cur==='dark'?'light':'dark';
  localStorage.setItem('ncsr-theme', next);
  document.documentElement.dataset.theme = next;
  if(monacoState==='ready') window.monaco.editor.setTheme(monacoTheme());
});
(function(){ const t=localStorage.getItem('ncsr-theme'); if(t) document.documentElement.dataset.theme=t; })();

load();
const paired = adoptFragmentKey();
render();
function pairedToast(){
  if(localStorage.getItem('ncsr-kofi-paired')) return toast('Paired — logs merged');
  localStorage.setItem('ncsr-kofi-paired','1');
  toast('Paired — logs merged ✓ Sync runs on a backend I pay for — <a href="https://ko-fi.com/adamtarantino" target="_blank" rel="noopener">buy me a coffee ☕</a> if it earns its keep', {html:true, ms:8000});
}
if(syncKey()){ syncNow().then(()=>{ if(paired) pairedToast(); }); }
</script>
